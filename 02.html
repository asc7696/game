<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Ninja - AI Studio Edition</title>
    <style>
        /* 禁止所有預設手勢與捲動，確保純淨的遊戲體驗 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none; /* 關鍵：防止手機下拉重新整理 */
        }

        canvas {
            display: block;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        }

        /* 遊戲結束覆蓋層 */
        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            display: none;
            pointer-events: none;
        }

        #restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            background: #e74c3c;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1 id="final-score">GAME OVER</h1>
        <button id="restart-btn" onclick="resetGame()">重新開始</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    /**
     * 【核心配置與參數】
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('ui-overlay');

    let width, height;
    let score = 0;
    let lives = 3;
    let isGameOver = false;

    const GRAVITY = 0.25; // 重力常數
    const fruits = [];    // 存活中的水果
    const particles = []; // 切開後的粒子
    const slashPoints = []; // 刀光軌跡點

    // 顏色配置
    const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#2ecc71', '#9b59b6'];

    /**
     * 初始化畫布尺寸
     */
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    /**
     * 【物件類別定義】
     */
    class Fruit {
        constructor() {
            this.radius = 30 + Math.random() * 20;
            this.x = Math.random() * (width - 100) + 50;
            this.y = height + this.radius;
            
            // 隨機初始速度：向上噴發與隨機水平位移
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = -(Math.sqrt(height) * 0.7 + Math.random() * 5); // 根據螢幕高度動態調整力度
            
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.sliced = false;
        }

        update() {
            this.vy += GRAVITY; // 應用重力
            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            if (this.sliced) return;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            // 加上高光
            ctx.beginPath();
            ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();
        }
    }

    class HalfFruit {
        // 水果被切開後的兩半
        constructor(x, y, radius, color, side) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.color = color;
            this.side = side; // -1 是左邊, 1 是右邊
            this.vx = side * (Math.random() * 4 + 2);
            this.vy = -2;
            this.rotation = 0;
            this.vRotation = side * 0.1;
            this.opacity = 1;
        }

        update() {
            this.vy += GRAVITY;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.vRotation;
            this.opacity -= 0.01;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.globalAlpha = Math.max(0, this.opacity);
            ctx.fillStyle = this.color;
            
            // 繪製半圓
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, Math.PI, 0, this.side === 1);
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.size = Math.random() * 5 + 2;
            this.color = color;
            this.life = 1.0;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= 0.03;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
        }
    }

    /**
     * 【核心邏輯：切割判定】
     * 使用線段與圓形的距離公式
     */
    function checkSlice(p1, p2) {
        if (isGameOver) return;

        for (let i = fruits.length - 1; i >= 0; i--) {
            let f = fruits[i];
            if (f.sliced) continue;

            // 計算點到線段的距離
            let dist = distToSegment({x: f.x, y: f.y}, p1, p2);
            
            if (dist < f.radius) {
                // 判定切中！
                f.sliced = true;
                score += 1;
                createSliceEffect(f);
            }
        }
    }

    function distToSegment(p, v, w) {
        const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
        if (l2 === 0) return Math.sqrt((p.x - v.x)**2 + (p.y - v.y)**2);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const proj = { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
        return Math.sqrt((p.x - proj.x)**2 + (p.y - proj.y)**2);
    }

    function createSliceEffect(f) {
        // 生成果肉粒子
        for (let i = 0; i < 10; i++) {
            particles.push(new Particle(f.x, f.y, f.color));
        }
        // 生成兩半水果
        particles.push(new HalfFruit(f.x, f.y, f.radius, f.color, -1));
        particles.push(new HalfFruit(f.x, f.y, f.radius, f.color, 1));
    }

    /**
     * 【輸入處理：滑動與觸控】
     */
    let isDrawing = false;
    function handleStart(e) {
        isDrawing = true;
        slashPoints.length = 0;
        const pos = getPos(e);
        slashPoints.push({ x: pos.x, y: pos.y, time: Date.now() });
    }

    function handleMove(e) {
        if (!isDrawing) return;
        const pos = getPos(e);
        const lastPoint = slashPoints[slashPoints.length - 1];
        
        const newPoint = { x: pos.x, y: pos.y, time: Date.now() };
        
        // 進行碰撞檢測
        if (lastPoint) {
            checkSlice(lastPoint, newPoint);
        }
        
        slashPoints.push(newPoint);
        // 只保留最近的軌跡點，產生拖尾消失效果
        if (slashPoints.length > 10) slashPoints.shift();
    }

    function handleEnd() {
        isDrawing = false;
    }

    function getPos(e) {
        const t = e.touches ? e.touches[0] : e;
        return { x: t.clientX, y: t.clientY };
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    canvas.addEventListener('touchend', handleEnd);

    /**
     * 【主循環】
     */
    let spawnTimer = 0;

    function gameLoop() {
        ctx.clearRect(0, 0, width, height);

        // 1. 繪製刀光軌跡 (Slash Trail)
        if (slashPoints.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.moveTo(slashPoints[0].x, slashPoints[0].y);
            for (let i = 1; i < slashPoints.length; i++) {
                ctx.lineTo(slashPoints[i].x, slashPoints[i].y);
            }
            ctx.stroke();
            // 自動淡出：若沒移動則清理舊點
            if (Date.now() - slashPoints[slashPoints.length-1].time > 50) {
                slashPoints.shift();
            }
        }

        // 2. 更新與繪製水果
        for (let i = fruits.length - 1; i >= 0; i--) {
            const f = fruits[i];
            f.update();
            f.draw();

            // 判斷掉出螢幕
            if (f.y - f.radius > height) {
                if (!f.sliced) {
                    lives--; // 沒切到，扣血
                    if (lives <= 0) gameOver();
                }
                fruits.splice(i, 1);
            } else if (f.sliced) {
                fruits.splice(i, 1); // 已經切開的本體直接移除，交給 HalfFruit 處理
            }
        }

        // 3. 更新與繪製粒子/半圓
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            p.draw();
            if (p.y > height + 100 || (p.life !== undefined && p.life <= 0)) {
                particles.splice(i, 1);
            }
        }

        // 4. 水果生成邏輯
        spawnTimer++;
        if (spawnTimer > 60 && !isGameOver) {
            const batch = Math.floor(Math.random() * 2) + 1; // 一次噴出 1~2 個
            for(let i=0; i<batch; i++) {
                fruits.push(new Fruit());
            }
            spawnTimer = 0;
        }

        // 5. 繪製 UI
        drawUI();

        if (!isGameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    function drawUI() {
        ctx.save();
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(`🍉 Score: ${score}`, 20, 40);
        
        ctx.textAlign = 'right';
        let heartStr = '';
        for(let i=0; i<3; i++) heartStr += (i < lives) ? '❤️' : '🖤';
        ctx.fillText(heartStr, width - 20, 40);
        ctx.restore();
    }

    function gameOver() {
        isGameOver = true;
        uiOverlay.style.display = 'block';
        document.getElementById('final-score').innerText = `GAME OVER\nScore: ${score}`;
    }

    function resetGame() {
        score = 0;
        lives = 3;
        isGameOver = false;
        fruits.length = 0;
        particles.length = 0;
        slashPoints.length = 0;
        uiOverlay.style.display = 'none';
        gameLoop();
    }

    // 啟動遊戲
    gameLoop();

</script>
</body>
</html>
