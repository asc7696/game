<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 互動學習大廳 - 第一~三章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-5px, 0); } 50% { transform: translate(5px, 0); } 75% { transform: translate(-5px, 0); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .code-block { font-family: 'Courier New', Courier, monospace; background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; line-height: 1.5; }
        .indent-1 { padding-left: 1.5rem; } .indent-2 { padding-left: 3rem; }
        .drop-zone { min-width: 40px; min-height: 40px; border: 2px dashed #cbd5e1; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; background: #f8fafc; transition: all 0.2s; font-weight: bold; }
        .drop-zone.active { border-color: #3b82f6; background-color: #eff6ff; }
        .sort-item { transition: transform 0.5s ease-in-out, background-color 0.3s; }
        .toggle-checkbox:checked { right: 0; border-color: #22c55e; }
        .toggle-checkbox:checked + .toggle-label { background-color: #22c55e; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #cbd5e1; border-radius: 9999px; transition: all 0.3s; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="app" class="min-h-screen">  
        <div id="user-display-info" class="fixed top-4 left-4 z-50 text-xs font-semibold text-slate-700 bg-white/90 backdrop-blur px-3 py-1.5 rounded-lg shadow border border-slate-200 hidden">
            班級：<span id="display-class" class="text-blue-600"></span> | 
            座號：<span id="display-seat" class="text-blue-600"></span> | 
            姓名：<span id="display-name" class="text-blue-600"></span>
        </div>  
    </div>

    <script>
        // ================= 全局狀態與後臺數據 =================
        let currentView = 'login';
        let timerInterval = null;
        let timeSeconds = 0;
        let isCountingDown = false;
        let initialDuration = 0;
        let currentAnimation = null;

        let unlockedLevels = {
            ch1_l1: true, ch1_l2: true, ch1_l3: true, ch1_l4: true, ch1_l5: true,
            ch2_l1: true, ch2_l2: true, ch2_l3: true, ch2_l4: true, ch2_l5: true,
            ch3_l1: true, ch3_l2: true, ch3_l3: true, ch3_l4: true, ch3_l5: true
        };

        let studentScores = {
            "1號 示範學生": { ch1_l1: { score: 100, time: 25, date: new Date().toLocaleString() } }
        };

        const LEVEL_NAMES = {
            ch1_l1: "1-1 程式設計的概念", ch1_l2: "1-2 Python 程式語言簡介", ch1_l3: "1-3 數值運算", ch1_l4: "1-4 字串運算", ch1_l5: "1-5 輸入輸出函式",
            ch2_l1: "2-1 關係運算與邏輯運算", ch2_l2: "2-2 單向與雙向選擇結構", ch2_l3: "2-3 多向選擇結構", ch2_l4: "2-4 巢狀選擇結構", ch2_l5: "2-5 綜合應用範例",
            ch3_l1: "3-1 計數迴圈 (for)", ch3_l2: "3-2 條件迴圈 (while)", ch3_l3: "3-3 巢狀迴圈", ch3_l4: "3-4 迴圈控制指令", ch3_l5: "3-5 綜合應用與除錯"
        };

        // 題目資料庫校正：完全對應 1-3 章各關卡
        const LEVELS_DATA = {
            ch1_l1: { title: "1-1 程式設計的概念", type: "drag-code", question: "請拖曳程式碼，完成將變數 x 設為 10，並輸出其值的程式：", blocks: ["x = 10", "print(x)"], correct: ["x = 10", "print(x)"], bg: "from-green-50 to-white", border: "border-green-300" },
            ch1_l2: { title: "1-2 Python 程式語言簡介", type: "drag-code", question: "完成正確的 Python 註解與列印提示：", blocks: ["# 這是註解", "print('Hello Python')"], correct: ["# 這是註解", "print('Hello Python')"], bg: "from-green-50 to-white", border: "border-green-300" },
            ch1_l3: { title: "1-3 數值運算", type: "drag-code", question: "計算 7 除以 3 的餘數並列印：", blocks: ["remainder = 7 % 3", "print(remainder)"], correct: ["remainder = 7 % 3", "print(remainder)"], bg: "from-green-50 to-white", border: "border-green-300" },
            ch1_l4: { title: "1-4 字串運算", type: "drag-code", question: "將兩個字串連接並輸出：", blocks: ["msg = 'Hello' + 'World'", "print(msg)"], correct: ["msg = 'Hello' + 'World'", "print(msg)"], bg: "from-green-50 to-white", border: "border-green-300" },
            ch1_l5: { title: "1-5 輸入輸出函式", type: "drag-code", question: "接收使用者輸入的名字並印出歡迎詞：", blocks: ["name = input('Name:')", "print('Hi', name)"], correct: ["name = input('Name:')", "print('Hi', name)"], bg: "from-green-50 to-white", border: "border-green-300" },
            
            ch2_l1: { title: "2-1 關係運算與邏輯運算", type: "drag-code", question: "判斷分數是否及格 (大於等於 60)：", blocks: ["is_pass = score >= 60", "print(is_pass)"], correct: ["is_pass = score >= 60", "print(is_pass)"], bg: "from-orange-50 to-white", border: "border-orange-300" },
            ch2_l2: { title: "2-2 單向與雙向選擇結構", type: "drag-code", question: "完成 if-else 雙向判斷架構：", blocks: ["if score >= 60:", "    print('Pass')", "else:", "    print('Fail')"], correct: ["if score >= 60:", "    print('Pass')", "else:", "    print('Fail')"], bg: "from-orange-50 to-white", border: "border-orange-300" },
            ch2_l3: { title: "2-3 多向選擇結構", type: "drag-code", question: "使用 elif 進行 A、B、C 級別的多向判斷：", blocks: ["if score >= 90:", "    print('A')", "elif score >= 80:", "    print('B')", "else:", "    print('C')"], correct: ["if score >= 90:", "    print('A')", "elif score >= 80:", "    print('B')", "else:", "    print('C')"], bg: "from-orange-50 to-white", border: "border-orange-300" },
            ch2_l4: { title: "2-4 巢狀選擇結構", type: "drag-code", question: "判斷是否為會員，若是再判斷年齡是否滿18：", blocks: ["if is_member:", "    if age >= 18:", "        print('Welcome')"], correct: ["if is_member:", "    if age >= 18:", "        print('Welcome')"], bg: "from-orange-50 to-white", border: "border-orange-300" },
            ch2_l5: { title: "2-5 綜合應用範例", type: "drag-code", question: "判斷一個整數是否為偶數：", blocks: ["if num % 2 == 0:", "    print('偶數')", "else:", "    print('奇數')"], correct: ["if num % 2 == 0:", "    print('偶數')", "else:", "    print('奇數')"], bg: "from-orange-50 to-white", border: "border-orange-300" },
            
            ch3_l1: { title: "3-1 計數迴圈 (for)", type: "drag-code", question: "利用 for 迴圈與 range 輸出 0 到 4：", blocks: ["for i in range(5):", "    print(i)"], correct: ["for i in range(5):", "    print(i)"], bg: "from-purple-50 to-white", border: "border-purple-300" },
            ch3_l2: { title: "3-2 條件迴圈 (while)", type: "drag-code", question: "利用 while 迴圈讓計數器從 1 跑到 5：", blocks: ["while count <= 5:", "    print(count)", "    count += 1"], correct: ["while count <= 5:", "    print(count)", "    count += 1"], bg: "from-purple-50 to-white", border: "border-purple-300" },
            ch3_l3: { title: "3-3 巢狀迴圈", type: "drag-code", question: "建立一個 2x2 的巢狀雙重迴圈：", blocks: ["for i in range(2):", "    for j in range(2):", "        print(i, j)"], correct: ["for i in range(2):", "    for j in range(2):", "        print(i, j)"], bg: "from-purple-50 to-white", border: "border-purple-300" },
            ch3_l4: { title: "3-4 迴圈控制指令", type: "drag-code", question: "在迴圈中當 i 等於 3 時中斷 (break) 迴圈：", blocks: ["for i in range(5):", "    if i == 3:", "        break"], correct: ["for i in range(5):", "    if i == 3:", "        break"], bg: "from-purple-50 to-white", border: "border-purple-300" },
            ch3_l5: { title: "3-5 綜合應用與除錯", type: "drag-code", question: "計算 1 到 10 的加總總和：", blocks: ["total = 0", "for i in range(1, 11):", "    total += i", "print(total)"], correct: ["total = 0", "for i in range(1, 11):", "    total += i", "print(total)"], bg: "from-purple-50 to-white", border: "border-purple-300" }
        };

        let savedClass = "";
        let seatNumber = "";
        let studentName = "";
        let currentPlayingLevelId = null;
        let selectedBlocks = [];
        let levelAttempts = 0;

        // ================= 核心渲染與控制引擎 =================
        function navigateTo(viewName) {
            currentView = viewName;
            render();
            if(viewName !== 'game' && timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            savedClass = document.getElementById('class-select').value;
            seatNumber = document.getElementById('seat-input').value.trim();
            studentName = document.getElementById('name-input').value.trim();

            if (!seatNumber || !studentName) {
                alert("請填寫完整的座號與姓名！");
                return;
            }

            document.getElementById('display-class').innerText = savedClass;
            document.getElementById('display-seat').innerText = seatNumber;
            document.getElementById('display-name').innerText = studentName;
            document.getElementById('user-display-info').classList.remove('hidden');

            navigateTo('lobby');
        }

        function startLevel(levelId) {
            currentPlayingLevelId = levelId;
            selectedBlocks = [];
            levelAttempts = 0;
            timeSeconds = 0;
            navigateTo('game');

            timerInterval = setInterval(() => {
                timeSeconds++;
                const timerEl = document.getElementById('game-timer');
                if (timerEl) timerEl.innerText = `時間: ${timeSeconds} 秒`;
            }, 1000);
        }

        function checkAnswer() {
            levelAttempts++;
            const level = LEVELS_DATA[currentPlayingPlayedId || currentPlayingLevelId];
            let isCorrect = true;

            if (selectedBlocks.length !== level.correct.length) {
                isCorrect = false;
            } else {
                for (let i = 0; i < level.correct.length; i++) {
                    if (selectedBlocks[i] !== level.correct[i]) {
                        isCorrect = false;
                    }
                }
            }

            if (isCorrect) {
                clearInterval(timerInterval);
                if (!studentScores[studentName]) studentScores[studentName] = {};
                studentScores[studentName][currentPlayingLevelId] = {
                    score: 100,
                    time: timeSeconds,
                    date: new Date().toLocaleString()
                };
                alert(`恭喜答對！花費時間: ${timeSeconds} 秒，嘗試次數: ${levelAttempts} 次`);
                submitScoreToGAS(currentPlayingLevelId, 100, timeSeconds, levelAttempts);
                navigateTo('lobby');
            } else {
                alert("答案不正確，請重新調整順序再試一次！");
                const zone = document.getElementById('drop-zone-main');
                if (zone) {
                    zone.classList.add('animate-shake');
                    setTimeout(() => zone.classList.remove('animate-shake'), 400);
                }
            }
        }

        // 送出資料到試算表機制 (GAS)
        async function submitScoreToGAS(levelId, score, timeUsed, attempts) {
            const payload = {
                className: savedClass,
                seatNumber: seatNumber,
                studentName: studentName,
                level: LEVEL_NAMES[levelId] || levelId,
                score: score,
                timeUsed: timeUsed,
                attempts: attempts,
                userAgent: navigator.userAgent
            };

            console.log("送出資料", payload);
            try {
                const response = await fetch(
                    "https://script.google.com/macros/s/AKfycbzjsNXVz5O0mY8x8CzayKhaU7vriOfocJy_Vozyr1jabmeu4wAiTqCYW3wBoUH3BE6y/exec",
                    {
                        method: "POST",
                        mode: "cors",
                        headers: { "Content-Type": "text/plain" },
                        body: JSON.stringify(payload)
                    }
                ).catch(err => {
                    console.warn("Fetch 被瀏覽器套件干擾...", err);
                    return null;
                });

                if (response && response.ok) {
                    const result = await response.json();
                    console.log("伺服器回傳結果:", result);
                }
            } catch (e) {
                console.error("傳送至試算表失敗", e);
            }
        }

        // ================= HTML 視圖模板渲染引擎 =================
        function render() {
            const app = document.getElementById('app');
            let html = "";

            if (currentView === 'login') {
                html = `
                <div class="flex items-center justify-center min-h-screen bg-slate-900 px-4">
                    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border-t-8 border-blue-600">
                        <h2 class="text-3xl font-black text-center text-slate-900 mb-2 tracking-tight">Python 互動學習大廳</h2>
                        <p class="text-center text-slate-500 mb-6 text-sm font-medium">第一 ~ 三章 程式基礎闖關系統</p>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-1">選擇班級</label>
                                <select id="class-select" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all font-medium">
                                    <option>資訊一甲</option><option>資訊一乙</option><option>電子一甲</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1">座號</label>
                                    <input type="number" id="seat-input" min="1" max="50" placeholder="例如：05" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all font-medium">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1">學生姓名</label>
                                    <input type="text" id="name-input" placeholder="請輸入姓名" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all font-medium">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 active:scale-95 transition-all shadow-md mt-2">開始登入闖關</button>
                        </form>
                    </div>
                </div>`;
            } 
            else if (currentView === 'lobby') {
                // 正確篩選 1-3 章各關卡進度
                const levelsKeys = Object.keys(LEVELS_DATA);
                const playedCount = levelsKeys.filter(k => studentScores[studentName]?.[k]).length;
                const totalProgress = Math.round((playedCount / levelsKeys.length) * 100);

                html = `
                <div class="max-w-6xl mx-auto px-4 py-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div>
                            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Python 程式基礎學習大廳</h1>
                            <p class="text-slate-500 font-medium">歡迎 ${studentName} 同學，請選擇一個章節與關卡開始進行挑戰。</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="navigateTo('report')" class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-indigo-700 active:scale-95 transition-all shadow-sm flex items-center gap-2">產生成績單</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-sm font-bold text-slate-700">總關卡完成進度</span>
                            <span class="text-sm font-black text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-full">${playedCount} / ${levelsKeys.length} 關 (${totalProgress}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                            <div class="bg-blue-600 h-3 rounded-full transition-all duration-500" style="width: ${totalProgress}%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-green-600 p-4 text-white font-bold text-lg flex justify-between">
                                <span>第一章：Python 基礎操作</span>
                            </div>
                            <div class="p-4 space-y-2">
                                ${renderLobbyLevelButtons('ch1')}
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-orange-600 p-4 text-white font-bold text-lg flex justify-between">
                                <span>第二章：條件選擇結構</span>
                            </div>
                            <div class="p-4 space-y-2">
                                ${renderLobbyLevelButtons('ch2')}
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="bg-purple-600 p-4 text-white font-bold text-lg flex justify-between">
                                <span>第三章：迴圈控制結構</span>
                            </div>
                            <div class="p-4 space-y-2">
                                ${renderLobbyLevelButtons('ch3')}
                            </div>
                        </div>
                    </div>
                </div>`;
            } 
            else if (currentView === 'game') {
                const level = LEVELS_DATA[currentPlayingLevelId];
                if (!level) {
                    html = `<div class="p-8 text-center text-red-500">關卡資料載入錯誤！</div>`;
                } else {
                    // 打亂拼圖區方塊
                    const remainingBlocks = level.blocks.filter(b => !selectedBlocks.includes(b));
                    
                    html = `
                    <div class="max-w-4xl mx-auto px-4 py-8">
                        <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <button onclick="navigateTo('lobby')" class="text-slate-500 hover:text-slate-800 font-bold">&larr; 返回大廳</button>
                                <span id="game-timer" class="text-lg font-mono font-bold bg-slate-100 px-3 py-1 rounded-lg">時間: 0 秒</span>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900 mb-2">${level.title}</h2>
                            <p class="text-slate-600 mb-6 font-medium">${level.question}</p>

                            <div class="mb-6">
                                <label class="block text-sm font-bold text-slate-500 mb-2">你的程式碼組合區域：</label>
                                <div id="drop-zone-main" class="min-h-[12rem] bg-slate-900 text-white rounded-xl p-4 space-y-2 font-mono">
                                    ${selectedBlocks.map((b, idx) => `
                                        <div class="bg-slate-800 p-3 rounded border border-slate-700 flex justify-between items-center">
                                            <span>${b.replace(/ /g, '&nbsp;')}</span>
                                            <button onclick="removeBlock(${idx})" class="text-red-400 hover:text-red-500 font-bold text-sm">移除</button>
                                        </div>
                                    `).join('')}
                                    ${selectedBlocks.length === 0 ? '<div class="text-center text-slate-500 py-12">請點擊下方方塊放入此處</div>' : ''}
                                </div>
                            </div>

                            <div class="mb-6">
                                <label class="block text-sm font-bold text-slate-500 mb-2">可用的程式碼拼圖（請點擊加入）：</label>
                                <div class="flex flex-wrap gap-3">
                                    ${remainingBlocks.map(b => `
                                        <button onclick="addBlock('${b.replace(/'/g, "\\'")}')" class="bg-slate-100 hover:bg-blue-100 hover:border-blue-400 border border-slate-300 px-4 py-2.5 rounded-xl font-mono text-slate-800 font-bold transition-all shadow-sm active:scale-95">
                                            ${b}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="flex gap-4">
                                <button onclick="checkAnswer()" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition-all shadow-md text-center text-lg active:scale-95">檢查答案是否正確</button>
                                <button onclick="selectedBlocks=[]; render();" class="bg-slate-200 text-slate-700 font-bold px-6 py-3 rounded-xl hover:bg-slate-300 transition-all active:scale-95">重設</button>
                            </div>
                        </div>
                    </div>`;
                }
            } 
            else if (currentView === 'report') {
                const keys = Object.keys(LEVELS_DATA);
                const scores = studentScores[studentName] || {};
                const passCount = keys.filter(k => scores[k]).length;
                const avgTime = passCount > 0 ? Math.round(keys.reduce((acc, k) => acc + (scores[k]?.time || 0), 0) / passCount) : 0;

                html = `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
                        <div class="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 class="text-3xl font-black text-slate-950 tracking-tight">資訊能力關卡認證成績單</h2>
                            <button onclick="navigateTo('lobby')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl transition-all">&larr; 返回大廳</button>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="block text-xs font-bold text-slate-400 mb-1">班級座號</span><span class="text-lg font-bold text-slate-800">${savedClass} / ${seatNumber}號</span></div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="block text-xs font-bold text-slate-400 mb-1">學生姓名</span><span class="text-lg font-bold text-slate-800">${studentName}</span></div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="block text-xs font-bold text-slate-400 mb-1">通過關卡</span><span class="text-lg font-black text-green-600">${passCount} / ${keys.length} 關</span></div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100"><span class="block text-xs font-bold text-slate-400 mb-1">平均耗時</span><span class="text-lg font-bold text-slate-800">${avgTime} 秒</span></div>
                        </div>

                        <div class="overflow-x-auto border border-slate-200 rounded-xl mb-6">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 font-bold text-sm border-b border-slate-200">
                                        <th class="p-4">關卡名稱</th><th class="p-4">狀態</th><th class="p-4">得分</th><th class="p-4">耗時</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm font-medium text-slate-700">
                                    ${keys.map(k => {
                                        const pass = !!scores[k];
                                        return `
                                        <tr>
                                            <td class="p-4">${LEVEL_NAMES[k]}</td>
                                            <td class="p-4">${pass ? '<span class="text-green-600 bg-green-50 px-2 py-0.5 rounded-full text-xs">已通過</span>' : '<span class="text-slate-400">未完成</span>'}</td>
                                            <td class="p-4 font-bold">${pass ? '100' : '0'}</td>
                                            <td class="p-4 font-mono">${pass ? scores[k].time + ' 秒' : '--'}</td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }

            app.innerHTML = html;
        }

        function renderLobbyLevelButtons(chapterPrefix) {
            const keys = Object.keys(LEVELS_DATA).filter(k => k.startsWith(chapterPrefix));
            return keys.map(k => {
                const isPassed = studentScores[studentName]?.[k];
                const btnColor = isPassed ? 'bg-green-100 text-green-800 border-green-300' : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200';
                return `
                <button onclick="startLevel('${k}')" class="w-full text-left p-3 border rounded-xl font-bold flex justify-between items-center transition-all ${btnColor}">
                    <span>${LEVEL_NAMES[k]}</span>
                    <span>${isPassed ? '✅ 已通過' : '⚔️ 挑戰'}</span>
                </button>`;
            }).join('');
        }

        function addBlock(blockText) {
            selectedBlocks.push(blockText);
            render();
        }

        function removeBlock(index) {
            selectedBlocks.splice(index, 1);
            render();
        }

        // 初始化加載
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
