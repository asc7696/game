<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MBTI 決策樹三關挑戰</title>
<style>
body { font-family: Arial; text-align: center; }
.box { border: 2px dashed #aaa; padding: 15px; width: 120px; min-height: 80px; margin: 10px; }
.container { display: flex; justify-content: center; flex-wrap: wrap; }
.item { background: #4CAF50; color: white; padding: 8px; margin: 5px; border-radius: 6px; cursor: pointer; }
.selected { background: orange; }
.hidden { display: none; }
button { padding: 10px 20px; margin: 10px; }
</style>
</head>

<body>

<h2>🌳 MBTI 決策樹挑戰</h2>
<h3 id="levelTitle">第1關：修復錯誤樹</h3>
<p id="desc">讓每個分支都有完整選項（S / N）</p>

<div>
  <div class="item" onclick="selectItem(this)">S</div>
  <div class="item" onclick="selectItem(this)">N</div>
</div>

<div class="container">
  <div>
    <h4>E 底下</h4>
    <div class="box" onclick="place('E')" id="E"></div>
  </div>
  <div>
    <h4>I 底下</h4>
    <div class="box" onclick="place('I')" id="I"></div>
  </div>
</div>

<button onclick="check()">檢查</button>
<p id="result"></p>

<h3 id="score">分數：0</h3>

<script>
let selected = null;
let level = 1;
let score = 0;

function selectItem(el){
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('selected'));
  el.classList.add('selected');
  selected = el.innerText;
}

function place(target){
  if(!selected) return;
  let box = document.getElementById(target);
  let div = document.createElement("div");
  div.innerText = selected;
  div.className = "item";
  box.appendChild(div);
}

function resetBoxes(){
  document.getElementById("E").innerHTML = "";
  document.getElementById("I").innerHTML = "";
}

function check(){
  let e = document.getElementById("E").innerText;
  let i = document.getElementById("I").innerText;
  let msg = "";

  if(level === 1){
    if(e.includes("S") && e.includes("N") && i.includes("S") && i.includes("N")){
      msg = "✅ 正確！進入第2關";
      score += 10;
      nextLevel();
    } else {
      msg = "❌ 錯誤！有分支缺失";
    }
  }

  else if(level === 2){
    if(e.length >= 2 && i.length >= 2){
      msg = "✅ 不錯！你建立了更多分類！進入第3關";
      score += 10;
      nextLevel();
    } else {
      msg = "❌ 分類太少，再試試";
    }
  }

  else if(level === 3){
    if(e.includes("S") && i.includes("S")){
      msg = "🎉 完成挑戰！你是決策樹高手！";
      score += 10;
    } else {
      msg = "❌ 邏輯仍有問題";
    }
  }

  document.getElementById("result").innerText = msg;
  document.getElementById("score").innerText = "分數：" + score;
}

function nextLevel(){
  level++;
  resetBoxes();

  if(level === 2){
    document.getElementById("levelTitle").innerText = "第2關：增加分類數量";
    document.getElementById("desc").innerText = "讓每個分支至少有2個選項";
  }

  if(level === 3){
    document.getElementById("levelTitle").innerText = "第3關：避免偏見";
    document.getElementById("desc").innerText = "不要讓某一類型消失";
  }
}
</script>

</body>
</html>
