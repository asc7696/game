<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 滾球冒險遊戲</title>
    <style>
        /* 清除預設邊距，隱藏滾動條 */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* 遊戲畫布 */
        #gameCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI 計分板與說明 */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        h1 { margin: 0; font-size: 24px; color: #00ffcc; }
        p { margin: 5px 0; font-size: 16px; }

        /* 遊戲結束畫面 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #game-over-screen.show {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h2 {
            font-size: 48px;
            color: #ff3366;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: scale(1.1);
            background: #00eeaa;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>3D BALL RUNNER</h1>
        <p>分數: <span id="score">0</span></p>
        <p>操作: ←/→ 或 A/D 移動，空白鍵跳躍</p>
    </div>

    <div id="game-over-screen">
        <h2>GAME OVER</h2>
        <p>你的最終分數是: <span id="final-score">0</span></p>
        <button class="btn" onclick="resetGame()">重新開始</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 遊戲變數設定 ---
        let scene, camera, renderer;
        let player;
        let obstacles = [];
        let score = 0;
        let isGameOver = false;
        
        // 玩家物理與狀態
        let playerVelocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.35;
        let isGrounded = true;
        
        // 按鍵監聽狀態
        const keys = { Left: false, Right: false, Jump: false };
        const laneWidth = 3; // 跑道單側寬度限制

        // --- 初始化遊戲 ---
        function init() {
            const canvas = document.getElementById('gameCanvas');

            // 1. 建立場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015); // 加入迷霧效果增強空間感

            // 2. 建立相機
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10); // 位於玩家後上方
            camera.lookAt(0, 0, 0);

            // 3. 建立渲染器
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // 4. 加入燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. 建立地板 (跑道)
            const floorGeo = new THREE.BoxGeometry(8, 1, 500);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5; // 讓表面剛好在 y=0
            floor.receiveShadow = true;
            scene.add(floor);

            // 6. 建立玩家 (發光的藍色球體)
            const playerGeo = new THREE.SphereGeometry(0.6, 32, 32);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.2, metalness: 0.5 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 0.6, 4);
            player.castShadow = true;
            scene.add(player);

            // 7. 監聽事件
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
