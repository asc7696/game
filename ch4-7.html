        let unlockedLevels = {
            ch4_l1: true, ch4_l2: true, ch4_l3: true, ch4_l4: true, ch4_l5: true,

        // studentScores = { "PlayerName": { levelId: { time: 85, date: "2023-10-15 10:30:00" } } }

            ch5_l1: "5-1 分而治之演算法", ch5_l2: "5-2 函式定義與呼叫", ch5_l3: "5-3 遞迴函數概念", ch5_l4: "5-4 階乘推導", ch5_l5: "5-5 費氏級數推導", ch5_l6: "5-6 遞迴牛刀小試",
            ch6_l1: "6-1 MBTI 決策樹", ch6_l2: "6-2 二元樹走訪", ch6_l3: "6-3 最小生成樹", ch6_l4: "6-4 最短路徑", ch6_l5: "6-5 字典樹",ch6_l6: "6-6 二元搜尋樹",
            ch7_l1: "7-1 元件與功能配對", ch7_l2: "7-2 規格大比拚", ch7_l3: "7-3 認識電子產業"

        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }
        function getNowString() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        function startTimer(mode = 'up', duration = 600, callback) {
            clearInterval(timerInterval);
            initialDuration = duration;
            if (mode === 'down') { timeSeconds = duration; isCountingDown = true; } else { timeSeconds = 0; isCountingDown = false; }
            timerInterval = setInterval(() => {
                if (isCountingDown) {
                    timeSeconds--;
                    if (timeSeconds <= 0) { clearInterval(timerInterval); showResult(false); }
                } else { timeSeconds++; }
                if (callback) callback();
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function changeView(view) {
            stopTimer();
            if (currentAnimation) { clearInterval(currentAnimation); currentAnimation = null; }
            currentView = view;
            window.scrollTo(0, 0);
            render();
        }

            Check: `<svg class="w-12 h-12 text-green-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`,
            X: `<svg class="w-12 h-12 text-red-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`,
            Lock: `<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`

        function showResult(success, mbtiResult = '') {
            const app = document.getElementById('app');
            const actualUsedTime = isCountingDown ? (initialDuration - timeSeconds) : timeSeconds;
            const scoreStr = isCountingDown ? `剩餘時間: ${formatTime(timeSeconds)}` : `完成耗時: ${formatTime(timeSeconds)}`;
            
            if (success && globalPlayerName !== 'Teacher') {
                if (!studentScores[globalPlayerName]) studentScores[globalPlayerName] = {};
                studentScores[globalPlayerName][currentView] = { time: actualUsedTime, date: getNowString() };
            }

            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-[100] px-4";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full animate-bounce-short">

            else if (currentView === 'ch4_l5') renderChallenge(app);

        // --- 登入 ---

            el.innerHTML = `

                                <button ${btnAction('ch4_l5')} class="${btnClass('ch4_l5')} border-orange-300"><span class="font-black text-orange-800">${LEVEL_NAMES['ch4_l5']}</span>${lockIcon('ch4_l5')}</button>

                                <button ${btnAction('ch5_l3')} class="${btnClass('ch5_l3')}"><span class="font-bold text-slate-700">${LEVEL_NAMES['ch5_l3']}</span>${lockIcon('ch5_l3')}</button>
                                <button ${btnAction('ch5_l4')} class="${btnClass('ch5_l4')}"><span class="font-bold text-slate-700">${LEVEL_NAMES['ch5_l4']}</span>${lockIcon('ch5_l4')}</button>
                                <button ${btnAction('ch5_l5')} class="${btnClass('ch5_l5')}"><span class="font-bold text-slate-700">${LEVEL_NAMES['ch5_l5']}</span>${lockIcon('ch5_l5')}</button>
                                <button ${btnAction('ch5_l6')} class="${btnClass('ch5_l6')} border-green-300"><span class="font-black text-green-800">${LEVEL_NAMES['ch5_l6']}</span>${lockIcon('ch5_l6')}</button>

        // --- 教師：後臺管理 ---
        function renderTeacherDashboard(el) {
            let studentRows = '';
            for (const [name, scores] of Object.entries(studentScores)) {
                const totalCompleted = Object.keys(scores).length;
                let detailsHtml = '<div class="grid grid-cols-1 xl:grid-cols-2 gap-2 mt-2">';
                for (const [lvl, data] of Object.entries(scores)) {
                    detailsHtml += `<div class="bg-blue-50 p-2 rounded-lg border border-blue-100 flex flex-col"><span class="font-bold text-blue-800 text-sm">${LEVEL_NAMES[lvl]}</span><span class="text-slate-600 font-mono text-sm">${formatTime(data.time)} (${data.time}s)</span><span class="text-slate-400 text-[10px] mt-1">${data.date}</span></div>`;
                }
                detailsHtml += '</div>';

                studentRows += `
                    <div class="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex justify-between items-center mb-2 border-b border-slate-200 pb-2">
                            <span class="font-black text-lg text-slate-800">${name}</span>
                            <span class="font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full text-sm">已完成 ${totalCompleted} 關</span>
                        </div>
                        ${Object.keys(scores).length > 0 ? detailsHtml : '<p class="text-slate-400 text-sm py-2">尚無過關紀錄</p>'}
                    </div>`;
            }
            let toggleRows = '';
            for (const [key, name] of Object.entries(LEVEL_NAMES)) {
                const isChecked = unlockedLevels[key] ? 'checked' : '';

                anim.innerHTML = `<div class="flex justify-between items-center relative mb-4"><div class="absolute top-1/2 left-0 right-0 h-1 bg-fuchsia-200 -z-10 -translate-y-1/2"></div><div class="absolute top-1/2 left-0 h-1 bg-fuchsia-500 -z-10 -translate-y-1/2 transition-all duration-500" style="width: ${(step/3)*100}%"></div>${[1,2,3,4].map((v, i) => `<div class="w-10 h-10 flex items-center justify-center rounded-full font-black border-4 transition-all duration-500 ${step===i?'border-fuchsia-500 bg-white text-fuchsia-600 scale-125 shadow-md':'border-fuchsia-200 bg-slate-50 text-slate-400'}">${v}</div>`).join('')}</div><div class="bg-fuchsia-50 text-fuchsia-800 px-6 py-2 rounded-lg font-bold text-center border border-fuchsia-100 shadow-sm">${descs[step]}</div>`;
            };

            window.dropInd = (ev, slot) => { ev.preventDefault(); const id = ev.dataTransfer.getData("id"); for(let k in window.iDrops) { if(window.iDrops[k]===id) delete window.iDrops[k]; } window.iDrops[slot]=id; window.renderIndInner(); };
            window.submitInd = () => { const tgts = { 'up_comp': 'mediatek', 'up_role': 'ic_eng', 'mid_comp': 'tsmc', 'mid_role': 'pe_eng', 'down_comp': 'ase', 'down_role': 'test_eng', 'ems_comp': 'foxconn' }; let ok=true; for(let k in tgts){ if(window.iDrops[k]!==tgts[k]) ok=false; } if(ok && Object.keys(window.iDrops).length===7){ stopTimer(); showResult(true); } else alert("配對有誤，請回想一下分工喔！"); };
            window.renderIndInner();
        }

        // 預設啟動
        render();
		
    </script>
