    <div id="app" class="min-h-screen">

    <script>
        // ================= 全局狀態與後臺數據 =================

        let unlockedLevels = {

            ch6_l1: true, ch6_l2: true, ch6_l3: true, ch6_l4: true,ch6_l5: true,ch6_l6: true,
            ch7_l1: true, ch7_l2: true, ch7_l3: true
        };

        // studentScores = { "PlayerName": { levelId: { time: 85, date: "2023-10-15 10:30:00" } } }

        const LEVEL_NAMES = {
		    ch1_l1: "1-1 程式設計的概念", ch1_l2: "1-2 Python 程式語言簡介", ch1_l3: "1-3 數值運算",
        
            ch4_l1: "4-1 氣泡排序法", ch4_l2: "4-2 選擇排序法", ch4_l3: "4-3 循序搜尋法", ch4_l4: "4-4 二元搜尋法", ch4_l5: "4-5 排序與搜尋挑戰",
            ch5_l1: "5-1 分而治之演算法", ch5_l2: "5-2 函式定義與呼叫", ch5_l3: "5-3 遞迴函數概念", ch5_l4: "5-4 階乘推導", ch5_l5: "5-5 費氏級數推導", ch5_l6: "5-6 遞迴牛刀小試",
            ch6_l1: "6-1 MBTI 決策樹", ch6_l2: "6-2 二元樹走訪", ch6_l3: "6-3 最小生成樹", ch6_l4: "6-4 最短路徑", ch6_l5: "6-5 字典樹",ch6_l6: "6-6 二元搜尋樹",

        };

        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }
        function getNowString() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        function startTimer(mode = 'up', duration = 600, callback) {
            clearInterval(timerInterval);
            initialDuration = duration;
            if (mode === 'down') { timeSeconds = duration; isCountingDown = true; } else { timeSeconds = 0; isCountingDown = false; }
            timerInterval = setInterval(() => {
                if (isCountingDown) {
                    timeSeconds--;
                    if (timeSeconds <= 0) { clearInterval(timerInterval); showResult(false); }
                } else { timeSeconds++; }
                if (callback) callback();
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function changeView(view) {
            stopTimer();
            if (currentAnimation) { clearInterval(currentAnimation); currentAnimation = null; }
            currentView = view;
            window.scrollTo(0, 0);
            render();
        }

        const Icons = {
            ArrowLeft: `<svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>`,
            Check: `<svg class="w-12 h-12 text-green-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`,
            X: `<svg class="w-12 h-12 text-red-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`,
            Lock: `<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`
        };

        function showResult(success, mbtiResult = '') {
            const app = document.getElementById('app');
            const actualUsedTime = isCountingDown ? (initialDuration - timeSeconds) : timeSeconds;
            const scoreStr = isCountingDown ? `剩餘時間: ${formatTime(timeSeconds)}` : `完成耗時: ${formatTime(timeSeconds)}`;
            
            if (success && globalPlayerName !== 'Teacher') {
                if (!studentScores[globalPlayerName]) studentScores[globalPlayerName] = {};
                studentScores[globalPlayerName][currentView] = { time: actualUsedTime, date: getNowString() };
            }

            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-[100] px-4";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full animate-bounce-short">
                    ${success ? Icons.Check : Icons.X}
                    <h2 class="text-2xl font-bold mb-2">${success ? '挑戰成功！' : '挑戰失敗'}</h2>
                    <p class="text-slate-600 mb-1">玩家：${globalPlayerName}</p>
                    <p class="text-slate-600 mb-4 font-bold text-lg">${scoreStr}</p>
                    ${mbtiResult ? `<p class="font-bold text-blue-600 mb-4 text-xl">結果：${mbtiResult}</p>` : ''}
                    <button onclick="changeView('menu')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold transition-colors">返回選單</button>
                </div>
            `;
            app.appendChild(modal);
        }

        window.drag = (ev, type, id) => { ev.dataTransfer.setData("type", type); ev.dataTransfer.setData("id", id); };
        window.allowDrop = (ev) => ev.preventDefault();

        // ================= 渲染引擎 =================
        function render() {
            const app = document.getElementById('app');

            else if (currentView === 'menu') renderMenu(app);
            else if (currentView === 'report') renderReportCard(app);
            else if (currentView === 'teacher') renderTeacherDashboard(app);

            else if (currentView === 'ch1_l2') renderPythonModule(app);

            else if (currentView === 'ch4_l4') renderBinarySearch(app);

            else if (currentView === 'ch5_l1') renderDivConq(app);

            else if (currentView === 'ch5_l4') renderFactorial(app);
            else if (currentView === 'ch5_l5') renderFibonacci(app);
            else if (currentView === 'ch5_l6') renderCowTest(app);

            else if (currentView === 'ch6_l4') renderShortestPath(app);
			else if (currentView === 'ch6_l5') renderTrieModule(app);
			else if (currentView === 'ch6_l6') renderBSTModule(app);

            else if (currentView === 'ch7_l1') renderHardwareMatch(app);
            else if (currentView === 'ch7_l2') renderLaptopBattle(app);
            else if (currentView === 'ch7_l3') renderIndustry(app);
        }

        function renderLogin(el) {
            el.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-slate-800 to-indigo-900 text-white relative overflow-hidden p-6">

            alert("型態判斷有誤！提示：int 是整數，float 是小數，str 需要引號，bool 只有 True/False。");
        }
    };

    window.renderPYInner();
}
