        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }
        function getNowString() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        function startTimer(mode = 'up', duration = 600, callback) {
            clearInterval(timerInterval);
            initialDuration = duration;
            if (mode === 'down') { timeSeconds = duration; isCountingDown = true; } else { timeSeconds = 0; isCountingDown = false; }
            timerInterval = setInterval(() => {
                if (isCountingDown) {
                    timeSeconds--;
                    if (timeSeconds <= 0) { clearInterval(timerInterval); showResult(false); }
                } else { timeSeconds++; }
                if (callback) callback();
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function changeView(view) {

// 點擊網頁內「進入大廳」按鈕時觸發
function login() {
    const classEl = document.getElementById("classInput");
    const seatEl = document.getElementById("seatInput");
    const nameEl = document.getElementById("nameInput");

    // 防呆：如果找不到輸入框元素，代表畫面可能還沒渲染出來
    if (!classEl || !seatEl || !nameEl) {
        alert("找不到輸入欄位，請嘗試重新整理網頁！");
        return;
    }

    const className = classEl.value.trim();
    const seatNumber = seatEl.value.trim();
    const studentName = nameEl.value.trim();

    if (!className || !seatNumber || !studentName) {
        alert("請填寫完整的班級、座號與姓名！");
        return;
    }

    // 儲存到瀏覽器
    localStorage.setItem("className", className);
    localStorage.setItem("seatNumber", seatNumber);
    localStorage.setItem("studentName", studentName);

    globalPlayerName = `${seatNumber}號 ${studentName}`;

    // 登入成功，切換畫面
    alert("登入成功！");
    
    if (typeof changeView === "function") {
        changeView('menu');
    } else if (typeof showTab === "function") {
        showTab('lobby');
    }

    // 切換完畫面後同步左上角資訊
    updateUIWithUserInfo(className, seatNumber, studentName);
}

}

    window.moveCP = (d) => { 
        window.cpStep = Math.max(0, Math.min(animSteps.length - 1, window.cpStep + d));

    };

    window.submitCP = () => {
        let isComplete = challengeItems.every(q => window.cpAns[q.id]);
        if(!isComplete) { alert("請完成所有題目再提交！"); return; }

        let correct = challengeItems.every(q => window.cpAns[q.id] === q.ans);
        if(correct) {
            if(typeof stopTimer === 'function') stopTimer();

    };

    window.renderCPInner();
}

<script>

//--------------------?
const GAS_URL = "https://script.google.com/macros/s/AKfycbxA3ApCJG_9Nyzii9tNTB2ntkPV6y7HoPbxmlkvWMnzQySNlSvR5qKzBZcvMBQNA8c9/exec";


// =========================
// 送成績
// =========================
// 新增一個全域鎖定變數，放在函式外面
let isSubmittingScore = false;

async function submitScore(level, score, timeUsed, attempts) {
  // 💡 1. 核心安全鎖：如果目前正在上傳中，直接攔截，不執行任何動作
  if (isSubmittingScore) {
    console.log("阻擋重複點擊：成績正在上傳中...");
    return;
  }

  // 💡 2. 立刻上鎖
  isSubmittingScore = true;

  // 嘗試在畫面上找出送出按鈕或結果視窗的按鈕，讓它變灰、無法點擊
  // 這樣能給學生極佳的視覺反饋
  const activeButtons = document.querySelectorAll('#app button');
  activeButtons.forEach(btn => {
      if(btn.innerText.includes("再試一次") || btn.innerText.includes("返回選單")) {
          btn.disabled = true;
          btn.style.opacity = "0.5";
          btn.style.cursor = "not-allowed";
      }
  });

  const savedClass = localStorage.getItem("className") || "201";
  const seatMatch = globalPlayerName.match(/^(\d+)\s*[號号]\s*(.+)$/);
  const seatNumber = seatMatch ? seatMatch[1] : "";
  const studentName = seatMatch ? seatMatch[2] : globalPlayerName;

  const payload = {
    className: savedClass,
    seatNumber: seatNumber,
    studentName: studentName,
    level: level,
    score: score,
    timeUsed: timeUsed,
    attempts: attempts,
    userAgent: navigator.userAgent
  };

  console.log("送出資料", payload);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzjsNXVz5O0mY8x8CzayKhaU7vriOfocJy_Vozyr1jabmeu4wAiTqCYW3wBoUH3BE6y/exec",
      {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      }
    ).catch(err => {
      console.warn("Fetch 被瀏覽器套件干擾...", err);
      return null;
    });

    if (!response) {
      alert("連線失敗，請檢查網路或確認 GAS 網址是否正確。");
      return;
    }

    if (!response.ok) {
      throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
    }

    const result = await response.json();
    console.log("伺服器回傳結果:", result);
    
    if (result.status === "success") {
      alert("成績上傳成功！");
    } else {
      alert("資料庫儲存失敗：" + result.message);
    }

  } catch (error) {
    console.error("送出失敗", error);
    alert("上傳失敗，請檢查網路連線或通知老師。");
  } finally {
    // 💡 3. 解鎖：不論成功或失敗，最後都把鎖解開，並讓按鈕恢復正常
    isSubmittingScore = false;
    activeButtons.forEach(btn => {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
    });
  }
}  
	//--------------------?
</script>
