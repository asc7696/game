<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="app" class="min-h-screen">  
	<div id="user-display-info" class="fixed top-4 left-4 z-50 text-xs font-semibold text-slate-700 bg-white/90 backdrop-blur px-3 py-1.5 rounded-lg shadow border border-slate-200 hidden">
  班級：<span id="display-class" class="text-blue-600"></span> | 
  座號：<span id="display-seat" class="text-blue-600"></span> | 
  姓名：<span id="display-name" class="text-blue-600"></span>
</div>  
        </div>

    <script>

        // ================= 全局狀態與後臺數據 =================
let currentView = 'login';
let timerInterval = null;
let timeSeconds = 0;
let isCountingDown = false;
let initialDuration = 0;
let currentAnimation = null;

// ================= 玩家資料 =================
let globalPlayerName = '';
let globalClassName = '';

// ================= 本地成績 =================
let scores = JSON.parse(localStorage.getItem('cs_lobby_scores')) || {};

let unlockedLevels = {
    ch1_l1: true, ch1_l2: true,
    ch4_l1: true, ch4_l2: true, ch4_l3: true, ch4_l4: true, ch4_l5: true,
    ch5_l1: true, ch5_l2: true, ch5_l3: true, ch5_l4: true, ch5_l5: true, ch5_l6: true,
    ch6_l1: true, ch6_l2: true, ch6_l3: true, ch6_l4: true, ch6_l5: true, ch6_l6: true,
    ch7_l1: true, ch7_l2: true, ch7_l3: true
};

let studentScores = {
    "1號 示範學生": {
        ch4_l1: {
            time: 85,
            date: "2024/05/20 14:30:12"
        }
    }
};

const LEVEL_NAMES = {
    ch4_l1: "4-1 氣泡排序法",
    ch4_l2: "4-2 選擇排序法",
    ch4_l3: "4-3 循序搜尋法",
    ch4_l4: "4-4 二元搜尋法",
    ch4_l5: "4-5 排序與搜尋挑戰",

    ch5_l1: "5-1 分而治之演算法",
    ch5_l2: "5-2 函式定義與呼叫",
    ch5_l3: "5-3 遞迴函數概念",
    ch5_l4: "5-4 階乘推導",
    ch5_l5: "5-5 費氏級數推導",
    ch5_l6: "5-6 遞迴牛刀小試",

    ch6_l1: "6-1 MBTI 決策樹",
    ch6_l2: "6-2 二元樹走訪",
    ch6_l3: "6-3 最小生成樹",
    ch6_l4: "6-4 最短路徑",
    ch6_l5: "6-5 字典樹",
    ch6_l6: "6-6 二元搜尋樹",

    ch7_l1: "7-1 元件與功能配對",
    ch7_l2: "7-2 規格大比拚",
    ch7_l3: "7-3 認識電子產業"
};
        function formatTime(s) {
            const m = Math.floor(s / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }
        function getNowString() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        function startTimer(mode = 'up', duration = 600, callback) {
            clearInterval(timerInterval);
            initialDuration = duration;
            if (mode === 'down') { timeSeconds = duration; isCountingDown = true; } else { timeSeconds = 0; isCountingDown = false; }
            timerInterval = setInterval(() => {
                if (isCountingDown) {
                    timeSeconds--;
                    if (timeSeconds <= 0) { clearInterval(timerInterval); showResult(false); }
                } else { timeSeconds++; }
                if (callback) callback();
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function changeView(view) {
            stopTimer();
            if (currentAnimation) { clearInterval(currentAnimation); currentAnimation = null; }
            currentView = view;
            window.scrollTo(0, 0);
            render();
        }

        const Icons = {
            ArrowLeft: `<svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>`,
            Check: `<svg class="w-12 h-12 text-green-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`,
            X: `<svg class="w-12 h-12 text-red-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`,
            Lock: `<svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`
        };


// ==========================================
// 遊戲挑戰結果結算與處理
// ==========================================
function showResult(success, mbtiResult = '') {
    // 先從 localStorage 拿取班級
    const savedClass = localStorage.getItem("className") || globalClassName || "";
    const app = document.getElementById('app');
    
    // 計算實際花費時間
    const actualUsedTime = isCountingDown ? (initialDuration - timeSeconds) : timeSeconds;
    const scoreStr = isCountingDown ? `剩餘時間: ${formatTime(timeSeconds)}` : `完成耗時: ${formatTime(timeSeconds)}`;

    if (success && globalPlayerName !== 'Teacher') {
        if (!studentScores[globalPlayerName]) studentScores[globalPlayerName] = {};
        studentScores[globalPlayerName][currentView] = { 
            time: actualUsedTime, 
            date: getNowString() 
        };
        
        // 💡 將數據與自動判定的獎牌拋給上傳機制
        submitScore(currentView, success ? 100 : 0, actualUsedTime, 1);
    }

    // 儲存至本機
    if (success) {
        scores[currentView] = { 
            score: 100, 
            timeUsed: actualUsedTime, 
            date: getNowString() 
        };
        localStorage.setItem('cs_lobby_scores', JSON.stringify(scores));
    }

    // 動態渲染過關/失敗的 UI 畫面
    app.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-6 animate-fade-in">
            <div class="bg-slate-800/80 backdrop-blur-md p-10 rounded-3xl shadow-2xl border border-slate-700 max-w-md w-full text-center">
                <div class="text-6xl mb-6">${success ? '🎉' : '❌'}</div>
                <h1 class="text-3xl font-black mb-2">${success ? '挑戰成功！' : '挑戰失敗'}</h1>
                <p class="text-slate-400 mb-6">${LEVEL_NAMES[currentView] || '未知關卡'}</p>
                
                <div class="bg-slate-950/50 rounded-2xl p-4 mb-6 font-mono text-left space-y-2 border border-slate-800">
                    <p class="text-slate-400">挑戰玩家：<span class="text-white font-bold">${savedClass ? savedClass + '班 ' : ''}${globalPlayerName}</span></p>
                    <p class="text-slate-400">結算成績：<span class="${success ? 'text-emerald-400' : 'text-rose-400'} font-bold">${success ? '100 分' : '0 分'}</span></p>
                    <p class="text-slate-400">時間記錄：<span class="text-yellow-400 font-bold">${scoreStr}</span></p>
                    ${mbtiResult ? `<p class="text-slate-400">性格分析：<span class="text-purple-400 font-bold">${mbtiResult}</span></p>` : ''}
                </div>

                <div class="space-y-3">
                    <button onclick="changeView('menu')" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all shadow-md">返回大廳地圖</button>
                    ${!success ? `<button onclick="changeView('${currentView}')" class="w-full py-3.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-all">重新挑戰</button>` : ''}
                </div>
            </div>
        </div>
    `;
}

// 💡 拖曳與連連看關卡專用全域工具函式
window.drag = (ev, type, id) => { 
    ev.dataTransfer.setData("type", type); 
    ev.dataTransfer.setData("id", id); 
};
window.allowDrop = (ev) => ev.preventDefault();

// ==========================================
// 核心數據同步：儲存至本機並同步上傳至 GOOGLE SHEET
// ==========================================
async function submitScore(level, score, timeUsed, attempts) {
  // 安全抓取班級、座號、姓名
  const savedClass = localStorage.getItem("className") || globalClassName || "未知班級";
  const seatMatch = globalPlayerName.match(/^(\\d+)\\s*[號号]\\s*(.+)$/);
  const seatNumber = seatMatch ? seatMatch[1] : "";
  const studentName = seatMatch ? seatMatch[2] : globalPlayerName;

  // 自動判定本次過關獲得的金、銀、銅牌
  const currentMedal = getMedalByTime(timeUsed);

  // 將 medal 欄位打包，準備傳送給後端 Google Apps Script (GAS) 寫入 Google Sheet
  const payload = {
    className: savedClass,
    seatNumber: seatNumber,
    studentName: studentName,
    level: level,
    score: score,
    timeUsed: timeUsed,
    attempts: attempts,
    medal: currentMedal, 
    userAgent: navigator.userAgent
  };

  console.log("正在送出全自動評級資料：", payload);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzjsNXVz5O0mY8x8CzayKhaU7vriOfocJy_Vozyr1jabmeu4wAiTqCYW3wBoUH3BE6y/exec",
      {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      }
    ).catch(err => {
      console.warn("Fetch 被套件干擾，嘗試忽略...", err);
      return null;
    });

    if (!response) return;

    if (response.ok) {
      const result = await response.json();
      console.log("伺服器雲端上傳成功:", result);
    }
  } catch (error) {
    console.error("雲端上傳失敗，已優先保存於本地:", error);
  }
}

// =================================
// 網頁自動登入與初始化載入點
// =================================
function initStudentInfo() {
    loadScores();
    
    // 讀取瀏覽器記憶，做到真正的自動分流
    const savedClass = localStorage.getItem("className");
    const savedSeat = localStorage.getItem("seatNumber");
    const savedName = localStorage.getItem("studentName");
    
    if (savedClass && savedSeat && savedName) {
        globalClassName = savedClass;
        globalPlayerName = `${savedSeat}號 ${savedName}`;
        changeView('menu');
    } else {
        changeView('login');
    }
}

// 啟動全網頁初始化
initStudentInfo();

</script>

</body></html>
