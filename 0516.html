            clearInterval(timerInterval);

    if (typeof timerInterval !== 'undefined' && timerInterval) {

    if (typeof fontTimerSeconds !== 'undefined') fontTimerSeconds = 0;

    // 核心防止：進到 3-6 卻還殘留 3-5 的 quizStatus 錯誤紅框樣式

// 💡 挑戰完畢結果對話框
function showResult(success, mbtiResult = '') {
    const savedClass = localStorage.getItem("className") || "";
    const app = document.getElementById('app');
    const actualUsedTime = isCountingDown ? (initialDuration - timeSeconds) : timeSeconds;
    
    // 🏆 動態劃分金、銀、銅牌與通關等級
    let award = "挑戰失敗";
    if (success) {
        if (actualUsedTime >= 0 && actualUsedTime <= 120) award = "金牌";
        else if (actualUsedTime > 120 && actualUsedTime <= 240) award = "銀牌";
        else if (actualUsedTime > 240 && actualUsedTime <= 360) award = "銅牌";
        else if (actualUsedTime > 360 && actualUsedTime <= 600) award = "挑戰成功";
        else award = "挑戰成功";
    }
    
    if (success && globalPlayerName !== 'Teacher') {
        if (!studentScores[globalPlayerName]) studentScores[globalPlayerName] = {};
        
        // 💾 同步將 award 與時間寫入本機
        studentScores[globalPlayerName][currentView] = { 
            time: actualUsedTime, 
            date: getNowString(),
            award: award
        };
        localStorage.setItem("studentScores", JSON.stringify(studentScores));
        
        // 🚀 發送至後端
        submitScore(currentView, success ? 100 : 0, actualUsedTime, 1, award);
    }
    
    const modal = document.createElement('div');
    modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-[100] px-4";
    modal.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-screen p-6 animate-fade-in w-full">

                    <div>⏱️ 耗時：${formatTime(actualUsedTime)}</div>
                    ${success ? `<div class="text-indigo-600 font-black text-lg">🏆 獲得獎項：${award}</div>` : ''}
                </div>
                <div class="flex gap-4">
                    <button onclick="changeView('menu')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition">返回大廳</button>
                </div>
            </div>
        </div>
    `;
    app.appendChild(modal);
}

// 點擊網頁內「進入大廳」按鈕時觸發
function login() {
    const classEl = document.getElementById("classInput");
    const seatEl = document.getElementById("seatInput");
    const nameEl = document.getElementById("nameInput");

    // 防呆：如果找不到輸入框元素，代表畫面可能還沒渲染出來
    if (!classEl || !seatEl || !nameEl) {
        alert("找不到輸入欄位，請嘗試重新整理網頁！");
        return;
    }

    const className = classEl.value.trim();
    const seatNumber = seatEl.value.trim();
    const studentName = nameEl.value.trim();

    if (!className || !seatNumber || !studentName) {
        alert("請填寫完整的班級、座號與姓名！");
        return;
    }

    // 儲存到瀏覽器
    localStorage.setItem("className", className);
    localStorage.setItem("seatNumber", seatNumber);
    localStorage.setItem("studentName", studentName);

    globalPlayerName = `${seatNumber}號 ${studentName}`;

    // 登入成功，切換畫面
    alert("登入成功！");
    
    if (typeof changeView === "function") {
        changeView('menu');
    } else if (typeof showTab === "function") {
        showTab('lobby');
    }

    // 切換完畫面後同步左上角資訊
    updateUIWithUserInfo(className, seatNumber, studentName);
}

// 負責把資料同步到左上角和成績單的欄位
function updateUIWithUserInfo(className, seatNumber, studentName) {
    // 1. 更新主網頁左上角
    const displayBox = document.getElementById("user-display-info");
    if (displayBox) {
        if(document.getElementById("display-class")) document.getElementById("display-class").innerText = className;
        if(document.getElementById("display-seat")) document.getElementById("display-seat").innerText = seatNumber;
        if(document.getElementById("display-name")) document.getElementById("display-name").innerText = studentName;
        displayBox.classList.remove("hidden"); // 顯示左上角
    }
}

window.checkCh2L3Result = function() {
    const state = window.ch2l3Inputs;
    
    // 全端完整驗證
    if (!state.q1 || !state.q2 || !state.q3 || !state.q4 || !state.q5 || !state.q6_1 || !state.q6_2 || !state.q6_3) {
        alert("⚠️ 還有欄位或新題目還沒填寫完畢喔！");
        return;
    }
    
    const isQ1Correct = (state.q1 === 'D');
    const isQ2Correct = (state.q2 === 'B');
    const isQ5Correct = (state.q5 === 'C'); // else 不能接條件
    
    // 順序陷阱題比對
    const isQ6_1Correct = (state.q6_1 === '兒童票');
    const isQ6_2Correct = (state.q6_2 === '兒童票');
    const isQ6_3Correct = (state.q6_3 === '全票');
    
    const isQ3Correct = (state.q3.toLowerCase() === 'elif');
    const isQ4Correct = (state.q4.replace(/\s+/g, '').toLowerCase() === 'else:');

    if (isQ1Correct && isQ2Correct && isQ5Correct && isQ6_1Correct && isQ6_2Correct && isQ6_3Correct && isQ3Correct && isQ4Correct) {
        if (typeof stopTimer === 'function') stopTimer();
        showResult(true);
    } else {
        const btn = document.getElementById('ch2l3-submit-btn');
        if (btn) {
            btn.classList.add('animate-shake', 'bg-red-600');
            setTimeout(() => btn.classList.remove('animate-shake', 'bg-red-600'), 400);
        }
        alert("❌ 驗證未通過！\n提示：\n1. else 後方不能有條件。\n2. 5歲在年齡小於等於12時就會被第一個區塊攔截，印出「兒童票」而非免票喔！此即為不看順序的經典地雷！");

};

window.validateCh2L4Fills = () => {
  const inputs = window.ch2l4Inputs;
  if (!inputs) return false;
  
  const cleanQ4 = inputs.q4.trim().replace(/\s+/g, '');
  const cleanQ5 = inputs.q5.trim().replace(/\s+/g, '');
  const cleanQ6 = inputs.q6 ? inputs.q6.trim().replace(/\s+/g, '') : '';
  const cleanQ7 = inputs.q7 ? inputs.q7.trim().replace(/\s+/g, '') : '';
  
  const isQ4Correct = (cleanQ4 === "a>=b>=c" || cleanQ4 === "a>=b>c");
  const isQ5Correct = (cleanQ5 === "a>=c" || cleanQ5 === "c<=a");
  const isQ6Correct = (cleanQ6 === "a>=c" || cleanQ6 === "c<=a");
  const isQ7Correct = (cleanQ7 === "c>b>a");
  
  return isQ4Correct && isQ5Correct && isQ6Correct && isQ7Correct;
};

window.submitCh2L4All = () => {
  const inputs = window.ch2l4Inputs;
  if (!inputs.q1 || !inputs.q2 || !inputs.q3.trim() || !inputs.q4.trim() || !inputs.q5.trim() || !inputs.q6.trim() || !inputs.q7.trim()) {
    alert("❌ 還有空格沒有填寫哦！請完成所有問題再進行驗證。");
    return;

  const isQ1Correct = inputs.q1 === 'A';
  const isQ2Correct = inputs.q2 === 'A';
  const isQ3Correct = inputs.q3.trim().replace(/\s+/g, '') === 'x%2==0';

    }
  }
};

    window.checkCh3L3BagEngine = function() {
        const state = window.ch3l3State;

        // 1. 未作答防呆 (確保檢查時，字串不是只有自動帶入的 "bag.")
        if (state.q1 === null || state.q2 === null || state.q3 === "bag." || state.q4 === "bag." || state.q5 === null || state.q6 === "bag." || state.q7 === "bag." || state.q8 === null) {
            alert("⚠️ 勇者，你還有背包任務沒有完成喔！請仔細檢查所有欄位。");
            return;
        }

        // 2. 嚴格清理：去除所有空格、統一將雙引號轉為單引號
        const cleanStr = (s) => s.replace(/\s+/g, '').replace(/"/g, "'");

        const ans3 = cleanStr(state.q3);
        const ans4 = cleanStr(state.q4);
        const ans6 = cleanStr(state.q6);
        const ans7 = cleanStr(state.q7);

        // 3. 邏輯對錯校對
        const isQ1Ok = (state.q1 === 1);
        const isQ2Ok = (state.q2 === 0);
        
        // 統一用單引號進行精準匹配
        const isQ3Ok = (ans3 === "bag.insert(3,'紅藥水')");
        const isQ4Ok = (ans4 === "bag.append('藍藥水')");
        const isQ5Ok = (state.q5 === 1);
        
        // 考慮 pop 的多元寫法
        const isQ6Ok = (ans6 === "bag.pop(-1)" || ans6 === "bag.pop()" || ans6 === "bag.pop(6)");
        const isQ7Ok = (ans7 === "bag.remove('木盾')");
        const isQ8Ok = (state.q8 === 0);

        if (isQ1Ok && isQ2Ok && isQ3Ok && isQ4Ok && isQ5Ok && isQ6Ok && isQ7Ok && isQ8Ok) {
            if (typeof stopTimer === 'function') stopTimer();
            window.ch3l3Status = "normal";
            if (typeof showResult === 'function') showResult(true); 
            alert("🎉 太棒了！你完美掌握了 Python 串列的新增與刪除操作，成功整理了冒險背包！");
        } else {
            window.ch3l3Status = "error";
            let errReport = "❌ 背包整理的邏輯有些漏洞喔！請查看線索：\n";
            if (!isQ1Ok) errReport += "• 任務①：新增到最後面，使用 .append() 是最佳首選！\n";
            if (!isQ2Ok) errReport += "• 任務②：強行插隊到最前面，請使用 .insert(0, ...)。\n";
            if (!isQ3Ok) errReport += "• 任務③：第四個位置對應的索引值是 3 喔！語法為 insert(3, '紅藥水')。\n";
            if (!isQ4Ok) errReport += "• 任務④：加到尾端請用 append('藍藥水')。\n";
            if (!isQ5Ok) errReport += "• 任務⑤：請依序數數看，聖劍在 0、紅藥水在 3、藍藥水在最後。\n";
            if (!isQ6Ok) errReport += "• 任務⑥：移除最後一項可直接調用不帶參數的 pop() 或是 pop(-1)。\n";
            if (!isQ7Ok) errReport += "• 任務⑦：直接指定名稱移除木盾，應使用 remove('木盾')。\n";

            alert(errReport);

    window.checkCh3L4AllEngine = function() {
        const state = window.ch3l4State;

        // 1. 基礎未完成防呆
        if (state.q1 === null || state.q2 === null || !state.c1_if || !state.c1_else || !state.c1_print || !state.c2_list1 || !state.c2_list2 || !state.c2_list3 || !state.c2_list4 || !state.c2_if) {
            alert("⚠️ 還有主題思考題、選擇題或下方的盲測填空題尚未完成喔！");
            return;
        }

        // 2. 文字清洗工具（✨ 修正：移除小括號，將所有雙引號統一轉單引號）
        const clean = (s) => s.replace(/\s+/g, '').replace(/"/g, "'").replace(/\(/g, '').replace(/\)/g, '');
        // 專門針對單一字的清洗工具（無論有沒有帶引號，都過濾成乾淨的單字本身）
        const cleanChar = (s) => s.replace(/['"\s]+/g, '');

        // 3. 校對各題答案
        const isQ1Correct = (state.q1 === 0); 
        const isQ2Correct = (state.q2 === 1); 

        // 挑戰 1 精準比對
        const c1IfAns = clean(state.c1_if);
        const isC1IfOk = (c1IfAns === "'王者披風'inbag:" || c1IfAns === "bag.count('王者披風')>0:"); 
        const isC1ElseOk = (clean(state.c1_else) === "else:");
        const isC1PrintOk = (state.c1_print.trim().length > 0);

        // 挑戰 2 精準比對（✨ 修正：使用 cleanChar，即使學生沒輸入引號也算對）
        const isL1 = (cleanChar(state.c2_list1) === "志");
        const isL2 = (cleanChar(state.c2_list2) === "豪");
        const isL3 = (cleanChar(state.c2_list3) === "雅");
        const isL4 = (cleanChar(state.c2_list4) === "婷");
        
        // 挑戰 2 的 if 嚴謹判定（✨ 修正：避免錯誤語法矇混過關，限定最合理的幾種成員檢查寫法）
        const c2IfAns = clean(state.c2_if);
        const validC2Answers = [
            "nameinlucky:", "luckyinname:", 
            "any(xinluckyforxinname):", "any(xinyforxinnameforyinlucky):"
        ];
        // 移除最後可能存在的冒號做彈性比對
        const c2IfAnsNoColon = c2IfAns.endsWith(':') ? c2IfAns.slice(0, -1) : c2IfAns;
        const isC2IfOk = validC2Answers.some(ans => c2IfAns === ans || c2IfAnsNoColon === ans.slice(0, -1));

        if (isQ1Correct && isQ2Correct && isC1IfOk && isC1ElseOk && isC1PrintOk && isL1 && isL2 && isL3 && isL4 && isC2IfOk) {
            if (typeof stopTimer === 'function') stopTimer();
            window.ch3l4Status = "normal";
            if (typeof showResult === 'function') showResult(true); 
            alert("🎉 恭喜通過！完全掌握了 in 和 not in 串列成員檢查的精髓！");
        } else {
            window.ch3l4Status = "error";
            let report = "❌ 偵測到部分代碼編譯或邏輯有誤！請參考下方除錯指引：\n";
            if (!isQ1Correct) report += "• 體驗 1：因為龍之鱗片確實在背包裡，條件為 True，所以守衛會開啟大門！\n";
            if (!isQ2Correct) report += "• 體驗 2：要看到歡迎訊息，必須滿足「玩家不在黑名單內」，因此要用 not in。\n";
            if (!isC1IfOk) report += "• 挑戰 1 (if)：請寫出包含冒號的完整成員條件，例如 '王者披風' in bag:\n";
            if (!isC1ElseOk) report += "• 挑戰 1 (else)：否則的分支，請確認拼字與冒號 else:\n";

            if (!isC2IfOk) report += "• 挑戰 2 (if)：請運用本章所學檢查成員資格，例如輸入 name in lucky: (檢查名字字串是否在幸運清單中)。";

}

  console.log("正在打包並送出資料至 GAS 後端...", payload);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzjsNXVz5O0mY8x8CzayKhaU7vriOfocJy_Vozyr1jabmeu4wAiTqCYW3wBoUH3BE6y/exec",
      {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }
    ).catch(err => {
      console.warn("Fetch 傳輸被瀏覽器安全套件攔截...", err);
      return null;
    });

    if (!response) {
      alert("網路連線失敗，請確認是否被防火牆或 AdBlock 阻擋。");
      return;
    }

    if (!response.ok) throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
    
    const result = await response.json();
    console.log("GAS 伺服器回傳結果:", result);
    
    if (result.status === "success") {
      alert(`🎉 成績與獎牌 [${award}] 已成功上傳雲端資料庫！`);
    } else {
      alert("雲端資料庫儲存失敗，請聯繫老師檢查 GAS 後端代碼設定。");
    }
  } catch (error) {
    console.error("成績上傳發生例外異常:", error);
  }
}
