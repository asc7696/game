            const sec = (s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }
        function getNowString() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        }

        function startTimer(mode = 'up', duration = 600, callback) {
            clearInterval(timerInterval);
            initialDuration = duration;
            if (mode === 'down') { timeSeconds = duration; isCountingDown = true; } else { timeSeconds = 0; isCountingDown = false; }
            timerInterval = setInterval(() => {
                if (isCountingDown) {
                    timeSeconds--;
                    if (timeSeconds <= 0) { clearInterval(timerInterval); showResult(false); }
                } else { timeSeconds++; }
                if (callback) callback();
            }, 1000);
        }

    currentView = view;

    if (view === 'menu' || view === 'report' || view === 'teacher') {

        resetLevelState(view);

    const app = document.getElementById('app');

    render();
}

// 💡 挑戰完畢結果對話框
function showResult(success, mbtiResult = '') {
    const savedClass = localStorage.getItem("className") || "";
    const app = document.getElementById('app');
    const actualUsedTime = isCountingDown ? (initialDuration - timeSeconds) : timeSeconds;
    
    // 🏆 動態劃分金、銀、銅牌與通關等級
    let award = "挑戰失敗";
    if (success) {
        if (actualUsedTime >= 0 && actualUsedTime <= 120) award = "金牌";
        else if (actualUsedTime > 120 && actualUsedTime <= 240) award = "銀牌";
        else if (actualUsedTime > 240 && actualUsedTime <= 360) award = "銅牌";
        else if (actualUsedTime > 360 && actualUsedTime <= 600) award = "挑戰成功";
        else award = "挑戰成功";
    }
    
    if (success && globalPlayerName !== 'Teacher') {
        if (!studentScores[globalPlayerName]) studentScores[globalPlayerName] = {};
        
        // 💾 同步將 award 與時間寫入本機
        studentScores[globalPlayerName][currentView] = { 
            time: actualUsedTime, 
            date: getNowString(),
            award: award
        };
        localStorage.setItem("studentScores", JSON.stringify(studentScores));
        
        // 🚀 發送至後端
        submitScore(currentView, success ? 100 : 0, actualUsedTime, 1, award);
    }
    
    const modal = document.createElement('div');
    modal.className = "fixed inset-0 bg-black/50 flex items-center justify-center z-[100] px-4";

                </div>

}

// 點擊網頁內「進入大廳」按鈕時觸發
function login() {
    const classEl = document.getElementById("classInput");
    const seatEl = document.getElementById("seatInput");
    const nameEl = document.getElementById("nameInput");

    // 防呆：如果找不到輸入框元素，代表畫面可能還沒渲染出來
    if (!classEl || !seatEl || !nameEl) {
        alert("找不到輸入欄位，請嘗試重新整理網頁！");
        return;
    }

    const className = classEl.value.trim();
    const seatNumber = seatEl.value.trim();
    const studentName = nameEl.value.trim();

    if (!className || !seatNumber || !studentName) {
        alert("請填寫完整的班級、座號與姓名！");
        return;
    }

    // 儲存到瀏覽器
    localStorage.setItem("className", className);
    localStorage.setItem("seatNumber", seatNumber);
    localStorage.setItem("studentName", studentName);

    globalPlayerName = `${seatNumber}號 ${studentName}`;

    // 登入成功，切換畫面
    alert("登入成功！");
    
    if (typeof changeView === "function") {
        changeView('menu');
    } else if (typeof showTab === "function") {
        showTab('lobby');
    }

    // 切換完畫面後同步左上角資訊
    updateUIWithUserInfo(className, seatNumber, studentName);
}

// 負責把資料同步到左上角和成績單的欄位
function updateUIWithUserInfo(className, seatNumber, studentName) {
    // 1. 更新主網頁左上角
    const displayBox = document.getElementById("user-display-info");
    if (displayBox) {
        if(document.getElementById("display-class")) document.getElementById("display-class").innerText = className;
        if(document.getElementById("display-seat")) document.getElementById("display-seat").innerText = seatNumber;
        if(document.getElementById("display-name")) document.getElementById("display-name").innerText = studentName;
        displayBox.classList.remove("hidden"); // 顯示左上角
    }
}

// 💡 2-6 邏輯評分與驗證引擎
// ==========================================
function checkCh2L6Result() {
    const state = window.ch2l5Inputs;

    // 檢查是否有未填寫的題目
    if (!state.q1 || !state.q2 || !state.q3 || !state.q4) {
        alert("⚠️ 還有題目還沒作答完成喔，請檢查所有選擇與填空！");
        return;
    }

    // 統一去除空格與將填空(一)小寫化以提升容錯率
    const ansQ3 = state.q3.toLowerCase();
    const ansQ4 = state.q4.replace(/\s+/g, ''); // 移除所有空白

    // 正確答案定義
    const isQ1Correct = (state.q1 === 'C');
    const isQ2Correct = (state.q2 === 'B');
    const isQ3Correct = (ansQ3 === 'while');
    const isQ4Correct = (ansQ4 === 'count-=1' || ansQ4 === 'count=count-1');

    if (isQ1Correct && isQ2Correct && isQ3Correct && isQ4Correct) {
        if (typeof stopTimer === 'function') stopTimer();
        // 成功，完美串接系統 GAS 雲端 Excel 資料庫
        showResult(true);
    } else {
        // 答錯時，觸發按鈕 animate-shake 紅色警告特效
        const btn = document.getElementById('ch2l6-submit-btn');
        if (btn) {
            btn.classList.add('animate-shake', 'bg-red-600');
            setTimeout(() => btn.classList.remove('animate-shake', 'bg-red-600'), 400);
        }
        
        // 細緻的反饋提示幫助學生學習
        let errorMsg = "❌ 答案有些不對喔！提示：\n";
        if (!isQ1Correct) errorMsg += "- 選擇題 1：請重新確認 while 與 for 迴圈適用的情境區別。\n";
        if (!isQ2Correct) errorMsg += "- 選擇題 2：追蹤變數 n：1 -> 3 -> 5，想一下 5 還有沒有符合小於 5 的條件？\n";
        if (!isQ3Correct) errorMsg += "- 填空題(一)：請輸入正確的 Python 關鍵字。\n";
        if (!isQ4Correct) errorMsg += "- 填空題(二)：倒數時計數變數每一次應該要遞減。";
        
        alert(errorMsg);
    }
}

// =========================
// 送成績
// =========================
// 新增一個全域鎖定變數，放在函式外面
let isSubmittingScore = false;

// 💡 送出成績到 Google Apps Script
// 💡 將成績、耗時與獎牌即時同步上傳至 Google Apps Script
async function submitScore(level, score, timeUsed, attempts, award = "") {
  const savedClass = localStorage.getItem("className") || "";
  
  // 🚀 修正解析器：完美相容 "05號 姓名"、"1號張三"、或直接無座號的純姓名狀況
  let seatNumber = "";
  let studentName = globalPlayerName;
  
  const seatMatch = globalPlayerName.match(/^(\d+)\s*號?\s*(.+)$/);
  if (seatMatch) {
      seatNumber = seatMatch[1];
      studentName = seatMatch[2].trim();
  }

  const payload = {
    className: savedClass,
    seatNumber: seatNumber,
    studentName: studentName,
    level: level,
    score: score,
    timeUsed: timeUsed,
    attempts: attempts,
    award: award, // 🏆 成功包含獎牌欄位
    userAgent: navigator.userAgent
  };

  console.log("正在打包並送出資料至 GAS 後端...", payload);

  try {
    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbzjsNXVz5O0mY8x8CzayKhaU7vriOfocJy_Vozyr1jabmeu4wAiTqCYW3wBoUH3BE6y/exec",
      {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }
    ).catch(err => {
      console.warn("Fetch 傳輸被瀏覽器安全套件攔截...", err);
      return null;
    });

    if (!response) {
      alert("網路連線失敗，請確認是否被防火牆或 AdBlock 阻擋。");
      return;
    }

    if (!response.ok) throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
    
    const result = await response.json();
    console.log("GAS 伺服器回傳結果:", result);
    
    if (result.status === "success") {
      alert(`🎉 成績與獎牌 [${award}] 已成功上傳雲端資料庫！`);
    } else {
      alert("雲端資料庫儲存失敗，請聯繫老師檢查 GAS 後端代碼設定。");
    }
  } catch (error) {
    console.error("成績上傳發生例外異常:", error);
  }
}
