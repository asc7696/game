<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動學習挑戰 - 樹狀結構與走訪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-55%, -50%) rotate(-5deg); }
            50% { transform: translate(-45%, -50%) rotate(5deg); }
            75% { transform: translate(-55%, -50%) rotate(-5deg); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce { animation: bounce 1s infinite; }
        
        .drag-active { outline: 2px dashed #3b82f6; outline-offset: 4px; }
        
        /* 隱藏原生捲軸但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-200">
    <div id="app" class="min-h-screen"></div>

    <script>
        // ================= 全局狀態與工具 =================
        let currentView = 'menu';
        let timerInterval = null;
        let timeElapsed = 0;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer(renderCallback) {
            stopTimer();
            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                renderCallback();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function changeView(view) {
            stopTimer();
            currentView = view;
            if (view === 'menu') renderMenu();
            if (view === 'level1') initLevel1();
            if (view === 'level2') initLevel2();
            if (view === 'level3') initLevel3();
            if (view === 'level4') initLevel4();
        }

        // 圖示 (SVG Strings)
        const Icons = {
            Play: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`,
            ArrowLeft: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
            CheckCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>`,
            RotateCcw: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            Network: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>`,
            Pencil: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>`,
            Eraser: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>`
        };

        // ================= 拖曳事件全局處理 =================
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev, type, id) {
            ev.dataTransfer.setData("type", type);
            if(type === 'bst-num') {
                ev.dataTransfer.setData("val", id);
            } else {
                ev.dataTransfer.setData("id", id);
            }
        }

        // ================= 主選單 =================
        function renderMenu() {
            document.getElementById('app').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 bg-gradient-to-br from-indigo-100 to-purple-100">
                    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-2xl w-full text-center">
                        <h1 class="text-4xl font-extrabold text-slate-800 mb-4">互動學習挑戰</h1>
                        <p class="text-slate-600 mb-8">選擇一個關卡開始您的挑戰，每個關卡都有獨特的邏輯與結構等您探索！</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button onclick="changeView('level1')" class="flex flex-col items-center justify-center bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 p-6 rounded-2xl transition-all duration-300 group">
                                <h2 class="text-xl font-bold mb-2">關卡一：MBTI 決策樹</h2>
                                <p class="text-sm opacity-80 text-center">了解性格維度，找出你的專屬人格</p>
                            </button>
                            <button onclick="changeView('level2')" class="flex flex-col items-center justify-center bg-emerald-50 hover:bg-emerald-600 hover:text-white text-emerald-700 p-6 rounded-2xl transition-all duration-300 group">
                                <h2 class="text-xl font-bold mb-2">關卡二：字彙字典樹</h2>
                                <p class="text-sm opacity-80 text-center">透過單字建構樹狀結構，考驗邏輯</p>
                            </button>
                            <button onclick="changeView('level3')" class="flex flex-col items-center justify-center bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-700 p-6 rounded-2xl transition-all duration-300 group">
                                <h2 class="text-xl font-bold mb-2">關卡三：二元搜尋樹</h2>
                                <p class="text-sm opacity-80 text-center">運用左小右大的規則排列數值節點</p>
                            </button>
                            <button onclick="changeView('level4')" class="flex flex-col items-center justify-center bg-violet-50 hover:bg-violet-600 hover:text-white text-violet-700 p-6 rounded-2xl transition-all duration-300 group shadow-md border-2 border-violet-200 hover:border-transparent">
                                <h2 class="text-xl font-bold mb-2 flex items-center gap-2">${Icons.Network} 關卡四：二元樹走訪</h2>
                                <p class="text-sm opacity-80 text-center">學習並完成前中後序的隨機樹走訪</p>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 關卡一：MBTI 決策樹 =================
        let l1_playerName = '';
        let l1_isStarted = false;
        let l1_isCompleted = false;
        let l1_dropped = {}; // { leafIndex: mbtiId }
        const l1_targets = { 0: 'ESTJ', 2: 'ESFJ', 7: 'ENFP', 8: 'ISTJ', 10: 'ISFJ', 11: 'ISFP' };

        function initLevel1() { 
            l1_playerName = '';
            l1_isStarted = false;
            l1_isCompleted = false;
            l1_dropped = {};
            renderLevel1(); 
        }

        function l1_start() {
            const input = document.getElementById('l1-name-input');
            if(input && input.value.trim() !== '') {
                l1_playerName = input.value.trim();
                l1_isStarted = true;
                renderLevel1();
                startTimer(updateL1Time); // 在點擊開始遊戲後，才啟動計時器
            }
        }

        function updateL1Time() {
            const timeEl = document.getElementById('l1-time');
            if(timeEl) timeEl.innerText = `計時：${formatTime(timeElapsed)}`;
        }

        function l1_drop(ev, index) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            if(type !== 'mbti') return;
            const id = ev.dataTransfer.getData("id");
            
            // Remove from other slots if already placed
            for(let key in l1_dropped) { if(l1_dropped[key] === id) delete l1_dropped[key]; }
            l1_dropped[index] = id;
            
            // Check completion
            let correctCount = 0;
            for(let k in l1_targets) { if(l1_dropped[k] === l1_targets[k]) correctCount++; }
            if(correctCount === 6) {
                l1_isCompleted = true;
                stopTimer();
            }
            renderLevel1();
        }

        function renderLevel1() {
            const app = document.getElementById('app');
            if(!l1_isStarted) {
                app.innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen bg-white">
                    <h2 class="text-3xl font-bold mb-6 text-blue-800">歡迎挑戰 MBTI 決策樹</h2>
                    <input id="l1-name-input" type="text" placeholder="請輸入玩家姓名" class="border-2 border-slate-300 p-3 rounded-xl mb-4 w-64 text-center focus:outline-none focus:border-blue-500 text-lg shadow-sm" maxlength="10"/>
                    <button onclick="l1_start()" class="px-8 py-3 rounded-full text-white font-bold text-lg transition-all bg-blue-600 hover:bg-blue-700 shadow-md">開始遊戲</button>
                    <button onclick="changeView('menu')" class="mt-6 flex items-center text-slate-500 hover:text-slate-800 transition-colors">${Icons.ArrowLeft} <span class="ml-1">返回主選單</span></button>
                </div>`;
                return;
            }

            app.innerHTML = `
            <div class="flex flex-col h-screen overflow-hidden">
                <div class="bg-white p-4 shadow-sm border-b flex items-center justify-between">
                    <button onclick="changeView('menu')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center">${Icons.ArrowLeft} 返回選單</button>
                    <div class="font-bold text-xl text-blue-800">關卡一：MBTI 決策樹</div>
                    <div id="l1-time" class="p-2 px-4 bg-slate-800 text-white rounded-lg font-mono text-lg">計時：${formatTime(timeElapsed)}</div>
                </div>
                <div class="p-4 bg-slate-50 flex gap-4 items-center overflow-x-auto border-b">
                    <span class="font-bold text-emerald-700 whitespace-nowrap">任務：將對應的人格拖曳至樹狀結構底部</span>
                    ${['ISFJ', 'ESFJ', 'ISTJ', 'ENFP', 'ISFP', 'ESTJ'].filter(id => !Object.values(l1_dropped).includes(id)).map(id => `
                        <div draggable="true" ondragstart="drag(event, 'mbti', '${id}')" class="bg-blue-100 border-2 border-blue-300 text-blue-800 px-3 py-1 rounded-md cursor-grab active:cursor-grabbing font-bold flex-shrink-0 hover:shadow-md transition-shadow">${id}</div>
                    `).join('')}
                    ${Object.values(l1_dropped).length === 6 ? '<span class="text-slate-400 italic font-bold">人格方塊已全部放置</span>' : ''}
                </div>
                <div class="flex-1 relative bg-slate-50 overflow-auto p-10 flex justify-center items-center">
                    ${l1_isCompleted ? `
                        <div class="absolute top-10 left-1/2 transform -translate-x-1/2 z-20 bg-green-100 border-2 border-green-500 text-green-800 px-8 py-4 rounded-2xl shadow-xl flex flex-col items-center animate-bounce">
                            <div class="text-green-600 mb-2">${Icons.CheckCircle}</div>
                            <h3 class="text-2xl font-bold">恭喜 ${l1_playerName} 完成 MBTI 挑戰！</h3>
                            <p class="text-lg mt-1">過關耗時：${formatTime(timeElapsed)}</p>
                        </div>
                    ` : ''}
                    <div class="w-[1000px] h-[500px] relative bg-white border-2 border-slate-200 shadow-md rounded-2xl">
                        <!-- 樹狀圖背景裝飾 -->
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-slate-300 font-bold text-2xl tracking-widest opacity-50 pointer-events-none">
                            MBTI DECISION TREE
                        </div>
                        <div class="absolute bottom-12 w-full flex justify-around px-4">
                            ${[0,2,7,8,10,11].map(index => `
                                <div class="flex flex-col items-center">
                                    <div class="text-sm font-bold text-slate-500 mb-2 bg-slate-100 px-3 py-1 rounded-full border">目標: ${l1_targets[index]}</div>
                                    <div ondragover="allowDrop(event)" ondrop="l1_drop(event, ${index})" 
                                        class="w-20 h-12 border-2 flex items-center justify-center font-bold text-lg rounded-lg shadow-sm transition-colors
                                        ${l1_dropped[index] ? 'bg-blue-50 border-blue-500 text-blue-800' : 'bg-white border-dashed border-slate-300 text-slate-300'}
                                        ${l1_dropped[index] === l1_targets[index] ? 'bg-green-100 border-green-500 text-green-700' : ''}
                                        ${l1_dropped[index] && l1_dropped[index] !== l1_targets[index] ? 'bg-red-50 border-red-400 text-red-600' : ''}
                                        ">
                                        ${l1_dropped[index] || '放置區'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // ================= 關卡二：字彙字典樹 =================
        const TRIE_WORDS = ['act', 'actor', 'action', 'air', 'airport', 'airpods', 'ant', 'any', 'angry'];
        const TRIE_NODES = [
            { id: 0, char: '', x: 500, y: 50, root: true },
            { id: 1, char: 'a', x: 500, y: 150, p: 0 },
            { id: 2, char: 'c', x: 250, y: 250, p: 1 },
            { id: 3, char: 't', x: 250, y: 350, p: 2, word: 'act' },
            { id: 4, char: 'o', x: 150, y: 450, p: 3 },
            { id: 5, char: 'r', x: 150, y: 550, p: 4, word: 'actor' },
            { id: 6, char: 'i', x: 350, y: 450, p: 3 },
            { id: 7, char: 'o', x: 350, y: 550, p: 6 },
            { id: 8, char: 'n', x: 350, y: 650, p: 7, word: 'action' },
            { id: 9, char: 'i', x: 500, y: 250, p: 1 },
            { id: 10, char: 'r', x: 500, y: 350, p: 9, word: 'air' },
            { id: 11, char: 'p', x: 500, y: 450, p: 10 },
            { id: 12, char: 'o', x: 500, y: 550, p: 11 },
            { id: 13, char: 'r', x: 450, y: 650, p: 12 },
            { id: 14, char: 't', x: 450, y: 750, p: 13, word: 'airport' },
            { id: 15, char: 'd', x: 550, y: 650, p: 12 },
            { id: 16, char: 's', x: 550, y: 750, p: 15, word: 'airpods' },
            { id: 17, char: 'n', x: 750, y: 250, p: 1 },
            { id: 18, char: 't', x: 650, y: 350, p: 17, word: 'ant' },
            { id: 19, char: 'y', x: 750, y: 350, p: 17, word: 'any' },
            { id: 20, char: 'g', x: 850, y: 350, p: 17 },
            { id: 21, char: 'r', x: 850, y: 450, p: 20 },
            { id: 22, char: 'y', x: 850, y: 550, p: 21, word: 'angry' }
        ];
        
        let l2_inputs = {};
        let l2_isCompleted = false;

        function initLevel2() { 
            l2_inputs = {};
            l2_isCompleted = false;
            renderLevel2();
            startTimer(updateL2Time); 
        }

        function updateL2Time() {
            const el = document.getElementById('l2-time');
            if(el) el.innerText = `計時：${formatTime(timeElapsed)}`;
        }

        function l2_handleChange(id, val) {
            if(l2_isCompleted) return;
            l2_inputs[id] = val.toLowerCase();
            
            // 單獨更新該 Input 的樣式，避免重新渲染整個頁面導致焦點丟失
            const el = document.getElementById(`l2-input-${id}`);
            const node = TRIE_NODES.find(n => n.id === id);
            
            if (el && node) {
                const isFilled = l2_inputs[id] === node.char;
                el.className = `w-10 h-10 text-center font-bold text-xl rounded-full border-2 focus:outline-none transition-all ${isFilled ? 'bg-emerald-100 border-emerald-500 text-emerald-700 shadow-emerald-200 shadow-md' : 'bg-white border-slate-300 focus:border-emerald-400'}`;
            }

            // 檢查是否全對
            let correct = true;
            for(let n of TRIE_NODES) {
                if(!n.root) {
                    if((l2_inputs[n.id] || '') !== n.char) {
                        correct = false;
                        break;
                    }
                }
            }

            if(correct && TRIE_NODES.length > 1) {
                l2_isCompleted = true;
                stopTimer();
                renderLevel2(); // 全對時重新渲染顯示過關訊息
            }
        }

        function renderLevel2() {
            const app = document.getElementById('app');
            app.innerHTML = `
            <div class="flex flex-col h-screen overflow-hidden">
                <div class="bg-white p-4 shadow-sm border-b flex items-center justify-between z-10">
                    <button onclick="changeView('menu')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center">${Icons.ArrowLeft} 返回選單</button>
                    <div class="flex gap-3 text-lg font-bold text-emerald-800">
                        ${TRIE_WORDS.map(w => `<span class="bg-emerald-100 px-3 py-1 rounded-full shadow-sm">${w}</span>`).join('')}
                    </div>
                    <div id="l2-time" class="p-2 px-4 bg-slate-800 text-white rounded-lg font-mono text-lg">計時：${formatTime(timeElapsed)}</div>
                </div>
                
                <div class="flex-1 bg-slate-50 relative overflow-auto p-10 flex justify-center">
                    ${l2_isCompleted ? `
                        <div class="absolute top-10 left-1/2 transform -translate-x-1/2 z-20 bg-green-100 border-2 border-green-500 text-green-800 px-8 py-4 rounded-2xl shadow-xl flex flex-col items-center animate-bounce">
                            <div class="text-green-600 mb-2">${Icons.CheckCircle}</div>
                            <h3 class="text-2xl font-bold">字典樹建構完成！</h3>
                            <p class="text-lg mt-1">耗時：${formatTime(timeElapsed)}</p>
                        </div>
                    ` : ''}

                    <div class="w-[1000px] h-[800px] relative bg-white rounded-3xl shadow-lg border border-slate-200">
                        <!-- 連線 -->
                        <svg width="100%" height="100%" class="absolute inset-0 pointer-events-none">
                            ${TRIE_NODES.filter(n => !n.root).map(node => {
                                const parent = TRIE_NODES.find(n => n.id === node.p);
                                return `<line x1="${parent.x}" y1="${parent.y}" x2="${node.x}" y2="${node.y}" stroke="#cbd5e1" stroke-width="3" />`;
                            }).join('')}
                        </svg>

                        <!-- Root 節點 -->
                        <div class="absolute transform -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center text-white font-bold shadow-md" style="left: 500px; top: 50px;">
                            Root
                        </div>

                        <!-- 字母輸入框 -->
                        ${TRIE_NODES.filter(n => !n.root).map(node => {
                            const val = l2_inputs[node.id] || '';
                            const isFilled = val === node.char;
                            const classes = isFilled 
                                ? 'bg-emerald-100 border-emerald-500 text-emerald-700 shadow-emerald-200 shadow-md' 
                                : 'bg-white border-slate-300 focus:border-emerald-400';
                            
                            return `
                            <div class="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center" style="left: ${node.x}px; top: ${node.y}px;">
                                <input 
                                    id="l2-input-${node.id}"
                                    type="text" 
                                    maxlength="1" 
                                    value="${val}"
                                    oninput="l2_handleChange(${node.id}, this.value)"
                                    class="w-10 h-10 text-center font-bold text-xl rounded-full border-2 focus:outline-none transition-all ${classes}"
                                />
                                ${node.word ? `<div class="absolute top-12 text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200 shadow-sm">${node.word}</div>` : ''}
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>`;
        }

        // ================= 關卡三：二元搜尋樹 =================
        const BST_NUMBERS = [58, 57, 12, 25, 36, 87, 54, 67, 20];
        const BST_NODES = [
            { id: 1, val: 58, x: 500, y: 100 },
            { id: 2, val: 57, x: 300, y: 200, p: 1 },
            { id: 3, val: 87, x: 700, y: 200, p: 1 },
            { id: 4, val: 12, x: 200, y: 300, p: 2 },
            { id: 5, val: 67, x: 600, y: 300, p: 3 },
            { id: 6, val: 25, x: 300, y: 400, p: 4 },
            { id: 7, val: 20, x: 200, y: 500, p: 6 },
            { id: 8, val: 36, x: 400, y: 500, p: 6 },
            { id: 9, val: 54, x: 500, y: 600, p: 8 }
        ];

        let l3_placedNodes = {};
        let l3_isCompleted = false;

        function initLevel3() { 
            l3_placedNodes = {};
            l3_isCompleted = false;
            renderLevel3();
            startTimer(updateL3Time);
        }

        function updateL3Time() {
            const el = document.getElementById('l3-time');
            if(el) el.innerText = `計時：${formatTime(timeElapsed)}`;
        }

        function l3_drop(ev, slotId) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            if(type !== 'bst-num') return;
            const val = parseInt(ev.dataTransfer.getData("val"), 10);
            if(isNaN(val)) return;

            // 移除已存在的相同數字
            for(let key in l3_placedNodes) {
                if(l3_placedNodes[key] === val) delete l3_placedNodes[key];
            }
            l3_placedNodes[slotId] = val;

            // 檢查是否完成
            let correctCount = 0;
            for(let node of BST_NODES) {
                if(l3_placedNodes[node.id] === node.val) correctCount++;
            }
            if(correctCount === BST_NODES.length) {
                l3_isCompleted = true;
                stopTimer();
            }
            renderLevel3();
        }

        function renderLevel3() {
            const app = document.getElementById('app');
            const poolNumbers = BST_NUMBERS.filter(num => !Object.values(l3_placedNodes).includes(num));

            app.innerHTML = `
            <div class="flex flex-col h-screen overflow-hidden">
                <div class="bg-white p-4 shadow-sm border-b flex flex-col md:flex-row items-center justify-between gap-4 z-10">
                    <button onclick="changeView('menu')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center whitespace-nowrap">${Icons.ArrowLeft} 返回選單</button>
                    
                    <div class="flex-1 flex justify-center items-center gap-2 overflow-x-auto px-4">
                        <span class="font-bold text-amber-700 whitespace-nowrap mr-2">拖曳數字池 (左小右大)：</span>
                        ${poolNumbers.map(num => `
                            <div draggable="true" ondragstart="drag(event, 'bst-num', '${num}')"
                                class="w-12 h-12 shrink-0 bg-amber-100 border-2 border-amber-400 text-amber-800 font-bold text-xl rounded-full flex items-center justify-center cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md hover:-translate-y-1 transition-all">
                                ${num}
                            </div>
                        `).join('')}
                        ${poolNumbers.length === 0 ? '<span class="text-slate-400 italic">無剩餘數字</span>' : ''}
                    </div>

                    <div id="l3-time" class="p-2 px-4 bg-slate-800 text-white rounded-lg font-mono text-lg whitespace-nowrap">計時：${formatTime(timeElapsed)}</div>
                </div>
                
                <div class="flex-1 bg-slate-50 relative overflow-auto p-10 flex justify-center">
                    ${l3_isCompleted ? `
                        <div class="absolute top-10 left-1/2 transform -translate-x-1/2 z-20 bg-green-100 border-2 border-green-500 text-green-800 px-8 py-4 rounded-2xl shadow-xl flex flex-col items-center animate-bounce">
                            <div class="text-green-600 mb-2">${Icons.CheckCircle}</div>
                            <h3 class="text-2xl font-bold">二元搜尋樹建構完成！</h3>
                            <p class="text-lg mt-1">耗時：${formatTime(timeElapsed)}</p>
                        </div>
                    ` : ''}

                    <div class="w-[1000px] h-[700px] relative bg-white rounded-3xl shadow-lg border border-slate-200">
                        <svg width="100%" height="100%" class="absolute inset-0 pointer-events-none">
                            ${BST_NODES.filter(n => n.p).map(node => {
                                const parent = BST_NODES.find(n => n.id === node.p);
                                return `<line x1="${parent.x}" y1="${parent.y}" x2="${node.x}" y2="${node.y}" stroke="#cbd5e1" stroke-width="3" />`;
                            }).join('')}
                        </svg>

                        ${BST_NODES.map(node => {
                            const placedVal = l3_placedNodes[node.id];
                            const isCorrect = placedVal === node.val;
                            const isError = placedVal && !isCorrect;

                            let classes = placedVal ? 'bg-white text-slate-800' : 'bg-slate-100 border-dashed border-slate-300 text-slate-300 hover:bg-amber-50 hover:border-amber-300';
                            if(isCorrect) classes = 'border-green-500 bg-green-50 text-green-700';
                            if(isError) classes = 'border-red-400 bg-red-50 text-red-600';

                            return `
                            <div class="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center" style="left: ${node.x}px; top: ${node.y}px;">
                                <div ondragover="allowDrop(event)" ondrop="l3_drop(event, ${node.id})"
                                    class="w-14 h-14 rounded-full flex items-center justify-center text-xl font-bold shadow-md transition-all border-4 ${classes}">
                                    ${placedVal || ''}
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>`;
        }

        // ================= 關卡四：二元樹走訪 (Level 4) =================
        let l4_treeData = null;
        let l4_phases = ['pre', 'in', 'post'];
        let l4_currentPhase = 0; // 0=pre, 1=in, 2=post
        let l4_userSequence = [];
        let l4_isCompleted = false;
        
        let l4_demoMode = null;
        let l4_demoSequence = [];
        let l4_demoActiveNode = null;
        let l4_demoInterval = null;

        function initLevel4() {
            generateL4Tree();
            renderLevel4();
        }

        function generateL4Tree() {
            const nodes = [{ id: 'A', left: null, right: null, p: null }];
            const letters = ['B','C','D','E','F','G','H'];
            
            letters.forEach(letter => {
                let added = false;
                while(!added) {
                    const available = nodes.filter(n => n.left === null || n.right === null);
                    const parent = available[Math.floor(Math.random() * available.length)];
                    
                    if (parent.left === null && parent.right === null) {
                        if (Math.random() > 0.5) parent.left = letter;
                        else parent.right = letter;
                        added = true;
                    } else if (parent.left === null) {
                        parent.left = letter;
                        added = true;
                    } else if (parent.right === null) {
                        parent.right = letter;
                        added = true;
                    }
                    if (added) {
                        nodes.push({ id: letter, left: null, right: null, p: parent.id });
                    }
                }
            });

            let xIndex = 1;
            const inOrderLayout = (nodeId, depth) => {
                if (!nodeId) return;
                const node = nodes.find(n => n.id === nodeId);
                inOrderLayout(node.left, depth + 1);
                node.x = xIndex * 60;
                node.y = depth * 70 + 40;
                xIndex++;
                inOrderLayout(node.right, depth + 1);
            };
            inOrderLayout('A', 0);

            const minX = Math.min(...nodes.map(n => n.x));
            const maxX = Math.max(...nodes.map(n => n.x));
            const containerWidth = 700;
            const offsetX = (containerWidth - (maxX - minX)) / 2 - minX;
            nodes.forEach(n => n.x += offsetX);

            const preSeq = [], inSeq = [], postSeq = [];
            const traverse = (nodeId) => {
                if (!nodeId) return;
                const node = nodes.find(n => n.id === nodeId);
                preSeq.push(nodeId);
                traverse(node.left);
                inSeq.push(nodeId);
                traverse(node.right);
                postSeq.push(nodeId);
            };
            traverse('A');

            l4_treeData = { nodes, preSeq, inSeq, postSeq };
            l4_currentPhase = 0;
            l4_userSequence = [];
            l4_isCompleted = false;
            
            startTimer(updateL4Time);
        }

        function playL4Demo(mode) {
            if(l4_demoInterval) clearInterval(l4_demoInterval);
            l4_demoMode = mode;
            const seq = mode === 'pre' ? ['A', 'B', 'C'] : mode === 'in' ? ['B', 'A', 'C'] : ['B', 'C', 'A'];
            l4_demoSequence = [];
            l4_demoActiveNode = null;
            
            let step = 0;
            renderLevel4();

            l4_demoInterval = setInterval(() => {
                if (step < 3) {
                    l4_demoActiveNode = seq[step];
                    l4_demoSequence.push(seq[step]);
                    step++;
                    renderLevel4();
                } else {
                    clearInterval(l4_demoInterval);
                    setTimeout(() => {
                        l4_demoActiveNode = null;
                        renderLevel4();
                    }, 800);
                }
            }, 1000);
        }

        function l4_handleNodeClick(id) {
            if (l4_isCompleted || l4_userSequence.includes(id)) return;
            
            const currentModeStr = l4_phases[l4_currentPhase];
            const targetSeq = l4_treeData[currentModeStr + 'Seq'];
            const expectedId = targetSeq[l4_userSequence.length];

            if (id === expectedId) {
                l4_userSequence.push(id);
                if (l4_userSequence.length === 8) {
                    if (l4_currentPhase < 2) {
                        l4_currentPhase++;
                        l4_userSequence = [];
                    } else {
                        l4_isCompleted = true;
                        stopTimer();
                    }
                }
                renderLevel4();
            } else {
                const btn = document.getElementById(`l4-node-${id}`);
                if (btn) {
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-700', 'animate-shake');
                    setTimeout(() => {
                        btn.classList.remove('bg-red-100', 'border-red-500', 'text-red-700', 'animate-shake');
                    }, 500);
                }
            }
        }

        function updateL4Time() {
            const timeEl = document.getElementById('l4-time');
            if(timeEl) timeEl.innerText = `計時：${formatTime(timeElapsed)}`;
        }

        function renderLevel4() {
            if(currentView !== 'level4') return;
            const app = document.getElementById('app');
            
            const getPhaseLabel = (index) => {
                if(index === 0) return '前序走訪 (Pre-Order)';
                if(index === 1) return '中序走訪 (In-Order)';
                return '後序走訪 (Post-Order)';
            };

            let html = `
            <div class="flex flex-col h-screen overflow-hidden bg-slate-100">
                <div class="bg-white p-4 shadow-sm shrink-0 border-b flex items-center justify-between">
                    <button onclick="changeView('menu')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center">
                        ${Icons.ArrowLeft} 返回選單
                    </button>
                    <div class="font-bold text-xl text-violet-800 flex items-center">
                        ${Icons.Network} <span class="ml-2">關卡四：二元樹走訪</span>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="initLevel4()" class="p-2 px-4 bg-violet-100 hover:bg-violet-200 text-violet-700 rounded-lg font-bold flex items-center transition-colors">
                            ${Icons.RotateCcw} <span class="ml-1">重新產生</span>
                        </button>
                        <div id="l4-time" class="p-2 px-4 bg-slate-800 text-white rounded-lg font-mono text-lg flex items-center">
                            計時：${formatTime(timeElapsed)}
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col lg:flex-row overflow-auto p-6 gap-6">
                    <!-- 左側：教學動畫區 -->
                    <div class="w-full lg:w-1/3 bg-white rounded-2xl shadow-md border border-slate-200 p-6 flex flex-col">
                        <h2 class="text-2xl font-bold text-slate-800 mb-4 border-b pb-2">教學演示</h2>
                        
                        <div class="flex-1 relative bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 mb-6 flex items-center justify-center min-h-[250px]">
                            <svg class="absolute inset-0 w-full h-full pointer-events-none">
                                <line x1="50%" y1="30%" x2="30%" y2="70%" stroke="#cbd5e1" stroke-width="3" />
                                <line x1="50%" y1="30%" x2="70%" y2="70%" stroke="#cbd5e1" stroke-width="3" />
                            </svg>
                            
                            ${['A', 'B', 'C'].map((id) => {
                                const posClass = id === 'A' ? 'top-[30%] left-[50%]' : id === 'B' ? 'top-[70%] left-[30%]' : 'top-[70%] left-[70%]';
                                const isActive = l4_demoActiveNode === id;
                                const isPassed = l4_demoSequence.includes(id);
                                let classes = isActive ? 'bg-yellow-300 border-yellow-500 scale-125 z-10' : 
                                            isPassed ? 'bg-violet-100 border-violet-400 text-violet-800' : 'bg-white border-slate-300';
                                return `<div class="absolute transform -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full flex items-center justify-center font-bold text-xl transition-all duration-300 shadow-md border-4 ${classes} ${posClass}">${id}</div>`;
                            }).join('')}
                        </div>

                        <div class="space-y-3">
                            <button onclick="playL4Demo('pre')" class="w-full text-left p-3 rounded-lg border-2 hover:bg-violet-50 hover:border-violet-300 flex items-center group transition-all">
                                <div class="text-violet-500 mr-2 group-hover:scale-110">${Icons.Play}</div>
                                <div>
                                    <div class="font-bold">前序走訪 (Pre-Order)</div>
                                    <div class="text-sm text-slate-500">順序：中(A) → 左(B) → 右(C)</div>
                                </div>
                            </button>
                            <button onclick="playL4Demo('in')" class="w-full text-left p-3 rounded-lg border-2 hover:bg-violet-50 hover:border-violet-300 flex items-center group transition-all">
                                <div class="text-violet-500 mr-2 group-hover:scale-110">${Icons.Play}</div>
                                <div>
                                    <div class="font-bold">中序走訪 (In-Order)</div>
                                    <div class="text-sm text-slate-500">順序：左(B) → 中(A) → 右(C)</div>
                                </div>
                            </button>
                            <button onclick="playL4Demo('post')" class="w-full text-left p-3 rounded-lg border-2 hover:bg-violet-50 hover:border-violet-300 flex items-center group transition-all">
                                <div class="text-violet-500 mr-2 group-hover:scale-110">${Icons.Play}</div>
                                <div>
                                    <div class="font-bold">後序走訪 (Post-Order)</div>
                                    <div class="text-sm text-slate-500">順序：左(B) → 右(C) → 中(A)</div>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- 右側：實戰測驗區 -->
                    <div class="w-full lg:w-2/3 bg-white rounded-2xl shadow-md border border-slate-200 p-6 flex flex-col relative overflow-hidden">
                        
                        ${l4_isCompleted ? `
                        <div class="absolute top-10 left-1/2 transform -translate-x-1/2 z-20 bg-green-100 border-2 border-green-500 text-green-800 px-8 py-4 rounded-2xl shadow-xl flex flex-col items-center animate-bounce">
                            <div class="text-green-600 mb-2">${Icons.CheckCircle}</div>
                            <h3 class="text-2xl font-bold">挑戰成功！三種走訪皆完成</h3>
                            <p class="text-lg mt-1">總耗時：${formatTime(timeElapsed)}</p>
                        </div>
                        ` : ''}

                        <!-- 任務進度標籤 -->
                        <div class="flex gap-2 mb-4">
                            ${[0, 1, 2].map(i => `
                                <div class="flex-1 py-2 px-3 rounded-lg border-2 text-center font-bold text-sm transition-all
                                    ${l4_currentPhase === i ? 'bg-violet-100 border-violet-500 text-violet-800 shadow-md transform scale-105' : 
                                      l4_currentPhase > i ? 'bg-green-50 border-green-400 text-green-700 opacity-70' : 'bg-slate-50 border-slate-200 text-slate-400'}">
                                    任務 ${i+1}: ${getPhaseLabel(i)}
                                    ${l4_currentPhase > i ? '<span class="ml-1 text-xs">✓</span>' : ''}
                                </div>
                            `).join('')}
                        </div>

                        <!-- 玩家點擊進度列 -->
                        <div class="flex flex-col sm:flex-row justify-between items-center bg-violet-50 p-4 rounded-xl border border-violet-200 mb-6 gap-4">
                            <div>
                                <h3 class="text-lg text-slate-600">當前任務：</h3>
                                <p class="text-xl font-bold text-violet-800 flex items-center">
                                    依序點擊完成 <span class="bg-violet-200 px-3 py-1 rounded-lg mx-2">${getPhaseLabel(l4_currentPhase)}</span>
                                </p>
                            </div>
                            <div class="flex gap-2 bg-white p-2 rounded-lg border border-slate-200 shadow-inner">
                                ${[0,1,2,3,4,5,6,7].map(i => `
                                    <div class="w-8 h-8 rounded flex items-center justify-center font-bold text-sm
                                        ${l4_userSequence[i] ? 'bg-green-100 border-2 border-green-500 text-green-700' : 'bg-slate-100 border-2 border-dashed border-slate-300 text-slate-400'}">
                                        ${l4_userSequence[i] || '?'}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 隨機樹狀圖畫布 -->
                        <div class="flex-1 relative bg-slate-50 rounded-xl border border-slate-200 min-h-[450px] overflow-hidden">
                            <svg width="100%" height="100%" class="absolute inset-0 pointer-events-none">
                                ${l4_treeData.nodes.map(node => {
                                    if (!node.p) return '';
                                    const parent = l4_treeData.nodes.find(n => n.id === node.p);
                                    return `<line x1="${parent.x}" y1="${parent.y}" x2="${node.x}" y2="${node.y}" stroke="#cbd5e1" stroke-width="3" />`;
                                }).join('')}
                            </svg>

                            ${l4_treeData.nodes.map(node => {
                                const isClicked = l4_userSequence.includes(node.id);
                                const classes = isClicked 
                                    ? 'bg-green-100 border-green-500 text-green-700 scale-90 cursor-default'
                                    : 'bg-white border-slate-300 hover:border-violet-400 hover:bg-violet-50 text-slate-700 hover:scale-110 cursor-pointer';
                                
                                return `
                                <button
                                    id="l4-node-${node.id}"
                                    onclick="l4_handleNodeClick('${node.id}')"
                                    class="absolute transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold transition-all duration-200 shadow-md border-4 ${classes}"
                                    style="left: ${node.x}px; top: ${node.y}px;"
                                >
                                    ${node.id}
                                </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
            
            app.innerHTML = html;
        }

        // 預設啟動
        renderMenu();

    </script>
</body>
</html>
