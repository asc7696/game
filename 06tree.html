<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動學習挑戰 - 樹狀結構與走訪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-55%, -50%) rotate(-5deg); }
            50% { transform: translate(-45%, -50%) rotate(5deg); }
            75% { transform: translate(-55%, -50%) rotate(-5deg); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce { animation: bounce 1s infinite; }
        
        /* 隱藏原生捲軸但保持可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans selection:bg-blue-200">
    <div id="app" class="min-h-screen"></div>

    <script>
        // ================= 全局狀態與工具 =================
        let globalPlayerName = '';
        let currentView = 'login';
        let timerInterval = null;
        let timeElapsed = 0;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer(renderCallback) {
            stopTimer();
            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                renderCallback();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function changeView(view) {
            stopTimer();
            currentView = view;
            if (view === 'login') renderLogin();
            if (view === 'menu') renderMenu();
            if (view === 'level1') initLevel1();
            if (view === 'level2') initLevel2();
            if (view === 'level3') initLevel3();
            if (view === 'level4') initLevel4();
            if (view === 'level5') initLevel5();
            if (view === 'level6') initLevel6();
        }

        // 圖示 (SVG Strings)
        const Icons = {
            Play: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`,
            ArrowLeft: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
            CheckCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>`,
            RotateCcw: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            Network: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>`,
            Pencil: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>`,
            Eraser: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>`,
            Map: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>`,
            Route: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg>`
        };

        // ================= 拖曳事件全局處理 =================
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev, type, id) {
            ev.dataTransfer.setData("type", type);
            if(type === 'bst-num') {
                ev.dataTransfer.setData("val", id);
            } else {
                ev.dataTransfer.setData("id", id);
            }
        }

        // ================= 登入頁面 =================
        function handleLogin() {
            const input = document.getElementById('global-name-input');
            if (input && input.value.trim() !== '') {
                globalPlayerName = input.value.trim();
                changeView('menu');
            } else {
                alert('請輸入姓名才能開始挑戰！');
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-100 to-blue-200">
                    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full text-center">
                        <h1 class="text-3xl font-extrabold text-blue-800 mb-2">互動學習挑戰</h1>
                        <p class="text-slate-500 mb-8">樹狀結構與走訪綜合測驗</p>
                        
                        <div class="mb-6 text-left">
                            <label class="block text-slate-700 font-bold mb-2">請輸入學生姓名：</label>
                            <input id="global-name-input" type="text" placeholder="例如：王小明" class="w-full border-2 border-slate-300 p-3 rounded-xl focus:outline-none focus:border-blue-500 text-lg shadow-sm" maxlength="15" onkeypress="if(event.key === 'Enter') handleLogin()"/>
                        </div>
                        
                        <button onclick="handleLogin()" class="w-full py-3 rounded-xl text-white font-bold text-lg transition-all bg-blue-600 hover:bg-blue-700 shadow-md">
                            進入學習大廳
                        </button>
                    </div>
                </div>
            `;
        }

        // ================= 主選單 =================
        function renderMenu() {
            document.getElementById('app').innerHTML = `
                <div class="flex flex-col items-center justify-center min-h-screen p-6 bg-gradient-to-br from-indigo-100 to-purple-100">
                    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-5xl w-full text-center">
                        <h1 class="text-4xl font-extrabold text-slate-800 mb-2">第六章學習大廳</h1>
                        <p class="text-blue-600 font-bold text-xl mb-8">歡迎挑戰，${globalPlayerName} 同學！請自由選擇關卡：</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            <button onclick="changeView('level1')" class="flex flex-col items-center justify-center bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-blue-100">
                                <h2 class="text-xl font-bold mb-2">關卡一：MBTI 決策樹</h2>
                                <p class="text-sm opacity-80 text-center">探索性格維度與決策分支</p>
                            </button>
                            <button onclick="changeView('level2')" class="flex flex-col items-center justify-center bg-emerald-50 hover:bg-emerald-600 hover:text-white text-emerald-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-emerald-100">
                                <h2 class="text-xl font-bold mb-2">關卡二：字彙字典樹</h2>
                                <p class="text-sm opacity-80 text-center">透過單字建構樹狀結構</p>
                            </button>
                            <button onclick="changeView('level3')" class="flex flex-col items-center justify-center bg-amber-50 hover:bg-amber-600 hover:text-white text-amber-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-amber-100">
                                <h2 class="text-xl font-bold mb-2">關卡三：二元搜尋樹</h2>
                                <p class="text-sm opacity-80 text-center">運用左小右大的規則排列數值</p>
                            </button>
                            <button onclick="changeView('level4')" class="flex flex-col items-center justify-center bg-violet-50 hover:bg-violet-600 hover:text-white text-violet-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-violet-100">
                                <h2 class="text-xl font-bold mb-2 flex items-center gap-2">${Icons.Network} 關卡四：二元樹走訪</h2>
                                <p class="text-sm opacity-80 text-center">前中後序隨機樹走訪實戰</p>
                            </button>
                            <button onclick="changeView('level5')" class="flex flex-col items-center justify-center bg-rose-50 hover:bg-rose-600 hover:text-white text-rose-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-rose-100">
                                <h2 class="text-xl font-bold mb-2 flex items-center gap-2">${Icons.Map} 關卡五：最小生成樹</h2>
                                <p class="text-sm opacity-80 text-center">規劃連接所有景點的最佳路線</p>
                            </button>
                            <button onclick="changeView('level6')" class="flex flex-col items-center justify-center bg-teal-50 hover:bg-teal-600 hover:text-white text-teal-700 p-6 rounded-2xl transition-all duration-300 group shadow border border-teal-100">
                                <h2 class="text-xl font-bold mb-2 flex items-center gap-2">${Icons.Route} 關卡六：最短路徑</h2>
                                <p class="text-sm opacity-80 text-center">找出指定兩點之間的最短距離</p>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= 關卡一：MBTI 決策樹 =================
        const MBTI_DESCS = [
            { id: 'ISFJ', title: 'ISFJ 守衛者 (The Defender)', desc: '這通常是全球人口佔比最高的人格（約 13-14%），以細心、溫柔、負責任和照顧他人而聞名。' },
            { id: 'ESFJ', title: 'ESFJ 執政官 (The Consul)', desc: '這類型的人非常熱情、樂於助人，喜歡與人互動並善於維繫社區或團體的和諧，非常普遍。' },
            { id: 'ISTJ', title: 'ISTJ 物流師 (The Logistician)', desc: '專注於事實、紀律和效率，是注重責任和秩序的保守型人才，人口基數較大。' },
            { id: 'ENFP', title: 'ENFP 競選者 (The Campaigner)', desc: '充满熱情、富有創造力且熱愛自由的樂天派，這種活潑的性格類型很常見。' },
            { id: 'ISFP', title: 'ISFP 探險家 (The Adventurer)', desc: '安靜但善於觀察，擁有藝術家般的審美，喜歡體驗新事物，是非常常見的「自由靈魂」。' },
            { id: 'ESTJ', title: 'ESTJ 總經理 (The Executive)', desc: '務實、果斷，喜歡組織和管理，善於確保事情有序進行，在職場和生活中都很常見。' }
        ];

        let l1_isCompleted = false;
        let l1_dropped = {}; // { leafIndex: mbtiId }
        let l1_treeData = null;
        let l1_edgeColors = {}; // { edgeId: 'red' | '#1e293b' }
        let l1_drawMode = 'pen'; // 'pen' or 'eraser'
        let l1_playerMbti = null;

        // Leaf indices based on binary path L=0, R=1
        // LLLL=0000=0(ESTJ), LLLR=0001=1(ESTP), LLRL=0010=2(ESFJ), LLRR=0011=3(ESFP)
        // LRLL=0100=4(ENTJ), LRLR=0101=5(ENTP), LRRL=0110=6(ENFJ), LRRR=0111=7(ENFP)
        // RLLL=1000=8(ISTJ), RLLR=1001=9(ISTP), RLRL=1010=10(ISFJ), RLRR=1011=11(ISFP)
        // RRLL=1100=12(INTJ), RRLR=1101=13(INTP), RRRL=1110=14(INFJ), RRRR=1111=15(INFP)
        const l1_targets = { 0: 'ESTJ', 2: 'ESFJ', 7: 'ENFP', 8: 'ISTJ', 10: 'ISFJ', 11: 'ISFP' };
        const l1_all_16 = ['ESTJ', 'ESTP', 'ESFJ', 'ESFP', 'ENTJ', 'ENTP', 'ENFJ', 'ENFP', 'ISTJ', 'ISTP', 'ISFJ', 'ISFP', 'INTJ', 'INTP', 'INFJ', 'INFP'];

        function initLevel1() { 
            l1_isCompleted = false;
            l1_dropped = {};
            l1_edgeColors = {};
            l1_drawMode = 'pen';
            l1_playerMbti = null;

            // Generate SVG Tree Data
            const nodes = [];
            const edges = [];
            const w = 1200;
            
            function genTree(id, level, x, y, dx, path) {
                nodes.push({ id, level, x, y, path });
                if (level < 4) {
                    const leftId = id + '_L';
                    const rightId = id + '_R';
                    const dy = 70;
                    edges.push({ id: `${id}-${leftId}`, from: id, to: leftId, label: level===0?'E':level===1?'S':level===2?'T':'J' });
                    genTree(leftId, level + 1, x - dx, y + dy, dx / 2, path + 'L');
                    
                    edges.push({ id: `${id}-${rightId}`, from: id, to: rightId, label: level===0?'I':level===1?'N':level===2?'F':'P' });
                    genTree(rightId, level + 1, x + dx, y + dy, dx / 2, path + 'R');
                }
            }
            genTree('root', 0, w / 2, 40, w / 4, '');
            l1_treeData = { nodes, edges };

            renderLevel1(); 
            startTimer(updateL1Time);
        }

        function updateL1Time() {
            const el = document.getElementById('l1-time');
            if(el) el.innerText = `計時：${formatTime(timeElapsed)}`;
        }

        function setL1DrawMode(mode) {
            l1_drawMode = mode;
            renderLevel1();
        }

        function l1_clickEdge(edgeId) {
            if(l1_isCompleted) return;
            l1_edgeColors[edgeId] = l1_drawMode === 'pen' ? '#ef4444' : '#1e293b';
            checkL1Completion();
            renderLevel1();
        }

        function l1_drop(ev, index) {
            ev.preventDefault();
            const type = ev.dataTransfer.getData("type");
            if(type !== 'mbti') return;
            const id = ev.dataTransfer.getData("id");
            
            for(let key in l1_dropped) { if(l1_dropped[key] === id) delete l1_dropped[key]; }
            l1_dropped[index] = id;
            
            checkL1Completion();
            renderLevel1();
        }

        function checkL1Completion() {
            // Check drops
            let correctCount = 0;
            for(let k in l1_targets) { if(l1_dropped[k] === l1_targets[k]) correctCount++; }

            // Check drawn path for MBTI
            let paths = [];
            function dfs(nodeId, currentStr) {
                if(currentStr.length === 4) { paths.push(currentStr); return; }
                let outEdges = l1_treeData.edges.filter(e => e.from === nodeId && l1_edgeColors[e.id] === '#ef4444');
                outEdges.forEach(e => dfs(e.to, currentStr + e.label));
            }
            dfs('root', '');
            
            if (paths.length === 1 && paths[0].length === 4) {
                l1_playerMbti = paths[0];
            } else {
                l1_playerMbti = null;
            }

            // Must have 6 correct drops AND a single drawn MBTI path
            if(correctCount === 6 && l1_playerMbti) {
                l1_isCompleted = true;
                stopTimer();
            }
        }

        function renderLevel1() {
            if(currentView !== 'level1') return;
            const app = document.getElementById('app');

            const leaves = l1_treeData.nodes.filter(n => n.level === 4);
            
            app.innerHTML = `
            <div class="flex flex-col h-screen overflow-hidden">
                <!-- 頂部區塊 -->
                <div class="bg-white p-4 shadow-sm border-b flex items-center justify-between shrink-0">
                    <button onclick="changeView('menu')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center">${Icons.ArrowLeft} 返回大廳</button>
                    <div class="font-bold text-xl text-blue-800">關卡一：MBTI 決策樹</div>
                    <div id="l1-time" class="p-2 px-4 bg-slate-800 text-white rounded-lg font-mono text-lg">計時：${formatTime(timeElapsed)}</div>
                </div>

                <!-- 資訊與工具列 -->
                <div class="bg-slate-50 flex flex-col md:flex-row border-b h-48 shrink-0">
                    <!-- 左側：說明文字 -->
                    <div class="w-full md:w-2/3 p-4 overflow-y-auto border-r border-slate-200 text-sm">
                        <div class="font-bold text-slate-700 mb-2">MBTI 四個維度：</div>
                        <div class="grid grid-cols-2 gap-2 mb-4 text-xs">
                            <div class="bg-white p-2 rounded border"><b>E(外向)</b>: 專注外部/社交充電 <br/> <b>I(內向)</b>: 專注內心/獨處反思</div>
                            <div class="bg-white p-2 rounded border"><b>S(實感)</b>: 依賴五官/重視事實 <br/> <b>N(直覺)</b>: 重視想像力/未來可能</div>
                            <div class="bg-white p-2 rounded border"><b>T(思考)</b>: 邏輯客觀/追求合理 <br/> <b>F(情感)</b>: 價值觀/人際和諧</div>
                            <div class="bg-white p-2 rounded border"><b>J(判斷)</b>: 井然有序/有計劃 <br/> <b>P(感知)</b>: 彈性靈活/保留選擇</div>
                        </div>
                        <div class="font-bold text-slate-700 mb-2">最常見的 6 個人格：</div>
                        <div class="space-y-1 text-xs">
                            ${MBTI_DESCS.map(d => `<div><span class="font-bold text-blue-700">${d.title}</span>：${d.desc}</div>`).join('')}
                        </div>
                    </div>

                    <!-- 右側：任務與工具 -->
                    <div class="w-full md:w-1/3 p-4 flex flex-col bg-slate-100 overflow-y-auto">
                        <div class="mb-4">
                            <span class="font-bold text-emerald-700 block mb-2">任務 1：拖曳六大人格至樹葉對應位置</span>
                            <div class="flex flex-wrap gap-2">
                                ${MBTI_DESCS.map(d => d.id).filter(id => !Object.values(l1_dropped).includes(id)).map(id => `
                                    <div draggable="true" ondragstart="drag(event, 'mbti', '${id}')" class="bg-blue-100 border-2 border-blue-400 text-blue-900 px-3 py-1 rounded-md cursor-grab active:cursor-grabbing font-bold shadow-sm hover:shadow-md transition-shadow">${id}</div>
                                `).join('')}
                                ${Object.values(l1_dropped).length === 6 ? '<span class="text-slate-400 italic font-bold">人格方塊已全部放置</span>' : ''}
                            </div>
                        </div>
                        <div>
                            <span class="font-bold text-rose-700 block mb-2">任務 2：點擊線條畫出你的性格路徑</span>
                            <div class="flex gap-2">
                                <button onclick="setL1DrawMode('pen')" class="px-3 py-1.5 rounded-md flex items-center text-sm font-bold transition-all ${l1_drawMode === 'pen' ? 'bg-red-500 text-white shadow' : 'bg-white border text-slate-600'}">
                                    ${Icons.Pencil} <span class="ml-1">紅筆</span>
                                </button>
                                <button onclick="setL1DrawMode('eraser')" class="px-3 py-1.5 rounded-md flex items-center text-sm font-bold transition-all ${l1_drawMode === 'eraser' ? 'bg-slate-700 text-white shadow' : 'bg-white border text-slate-600'}">
                                    ${Icons.Eraser} <span class="ml-1">橡皮擦</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 決策樹互動區 -->
                <div class="flex-1 relative overflow-auto bg-white p-6 flex justify-center items-start">
                    ${l1_isCompleted ? `
                        <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 bg-green-100 border-4 border-green-500 text-green-800 px-10 py-8 rounded-3xl shadow-2xl flex flex-col items-center animate-bounce">
                            <div class="text-green-600 mb-4 scale-150">${Icons.CheckCircle}</div>
                            <h3 class="text-3xl font-extrabold mb-2">任務完成！</h3>
                            <p class="text-xl font-bold mb-1">玩家：<span class="text-blue-700">${globalPlayerName}</span></p>
                            <p class="text-xl font-bold mb-4">分數 (耗時)：<span class="text-red-600">${formatTime(timeElapsed)}</span></p>
                            <div class="bg-white px-6 py-3 rounded-xl border-2 border-green-300 shadow-inner">
                                <span class="text-lg text-slate-600">你的 MBTI 性格：</span>
                                <span class="text-3xl font-black text-green-700 ml-2 tracking-wider">${l1_playerMbti}</span>
                            </div>
                        </div>
                        <div class="fixed inset-0 bg-black/20 z-40 pointer-events-none"></div>
                    ` : ''}

                    <div class="w-[1200px] h-[480px] relative">
                        <!-- SVG 連線 -->
                        <svg width="100%" height="100%" class="absolute inset-0">
                            ${l1_treeData.edges.map(edge => {
                                const fromNode = l1_treeData.nodes.find(n => n.id === edge.from);
                                const toNode = l1_treeData.nodes.find(n => n.id === edge.to);
                                const color = l1_edgeColors[edge.id] || '#1e293b';
                                const isRed = color === '#ef4444';
                                const midX = (fromNode.x + toNode.x) / 2;
                                const midY = (fromNode.y + toNode.y) / 2;

                                return `

        function generateL4Tree() {
            const nodes = [{ id: 'A', left: null, right: null, p: null }];
            const letters = ['B','C','D','E','F','G','H'];
            
            letters.forEach(letter => {
                let added = false;
                while(!added) {
                    const available = nodes.filter(n => n.left === null || n.right === null);
                    const parent = available[Math.floor(Math.random() * available.length)];
                    
                    if (parent.left === null && parent.right === null) {
                        if (Math.random() > 0.5) parent.left = letter;
                        else parent.right = letter;
                        added = true;
                    } else if (parent.left === null) {
                        parent.left = letter;
                        added = true;
                    } else if (parent.right === null) {
                        parent.right = letter;
                        added = true;
                    }
                    if (added) { nodes.push({ id: letter, left: null, right: null, p: parent.id }); }
                }
            });

            let xIndex = 1;
            const inOrderLayout = (nodeId, depth) => {
                if (!nodeId) return;
                const node = nodes.find(n => n.id === nodeId);
                inOrderLayout(node.left, depth + 1);
                node.x = xIndex * 60;
                node.y = depth * 70 + 40;
                xIndex++;
                inOrderLayout(node.right, depth + 1);
            };
            inOrderLayout('A', 0);

                traverse(node.left);
                inSeq.push(nodeId);
                traverse(node.right);
                postSeq.push(nodeId);

            traverse('A');

            l4_currentPhase = 0;
            l4_userSequence = [];
            l4_isCompleted = false;

                            }).join('')}
                            
                            <!-- Nodes -->
                            ${L6_NODES.map(node => {
                                let fill = '#fff';
                                let stroke = '#cbd5e1';
                                let textColor = '#334155';
                                if (node.id === 'A') { fill = '#bbf7d0'; stroke = '#22c55e'; textColor = '#166534'; } // Start Node
                                if (node.id === 'H') { fill = '#fecaca'; stroke = '#ef4444'; textColor = '#991b1b'; } // End Node

                                return `
                                <circle cx="${node.x}" cy="${node.y}" r="22" fill="${fill}" stroke="${stroke}" stroke-width="4" />
                                <text x="${node.x}" y="${node.y}" text-anchor="middle" dy="6" font-size="18" font-weight="bold" fill="${textColor}">${node.id}</text>
                                `;
                            }).join('')}
                        </svg>
                    </div>
                </div>
            </div>
            `;
        }

        // 預設啟動登入畫面
        renderLogin();

    </script>
</body>
</html>
