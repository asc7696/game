<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 互動學習大廳 - 終極修復版</title>
    <!-- 使用 Tailwind CSS 加速 UI 開發 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --bg-slate: #f1f5f9;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-slate);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .content-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        .code-block {
            font-family: 'Courier New', Courier, monospace;
            background: #1e293b;
            color: #f8fafc;
            padding: 1.5rem;
            border-radius: 0.75rem;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 1rem 0;
            border-left: 6px solid #f59e0b;
        }

        svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .node-circle {
            stroke-width: 3;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node-text {
            pointer-events: none;
            user-select: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .btn {
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-gray { background: #e2e8f0; color: #475569; }
        .btn-gray:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        let state = {
            view: 'menu',
            ch4Step: 0,
            ch6Step: 0
        };

        const Icons = {
            Back: `<svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>`,
            Next: `<svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`
        };

        function setView(v) {
            state.view = v;
            render();
            window.scrollTo(0, 0);
        }

        // --- 1. 主選單渲染 ---
        function renderMenu(app) {
            app.innerHTML = `
                <div class="main-container fade-in">
                    <header class="text-center mb-12">
                        <h1 class="text-5xl font-black text-slate-800 mb-4 tracking-tight">CS 互動學習大廳</h1>
                        <p class="text-slate-500 text-lg">全章節佈局優化版 - 強化樹狀圖層次顯示</p>
                    </header>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${renderCard('ch4_1', 'Chapter 4-1', '模組化與函式', '解決函式定義與呼叫的邏輯展示。', 'border-amber-500')}
                        ${renderCard('ch4_4', 'Chapter 4-4', '參數傳遞機制', '理解區域變數與全域變數的差異。', 'border-blue-500')}
                        ${renderCard('ch6_6', 'Chapter 6-1 ~ 6-6', '二元搜尋樹 (BST)', '掌握樹的階層與左小右大建構邏輯。', 'border-emerald-500')}
                        ${renderCard('ch7_1', 'Chapter 7-1', '排序演算法', '視覺化觀察資料交換的過程。', 'border-rose-500')}
                    </div>
                </div>
            `;
        }

        function renderCard(id, tag, title, desc, borderColor) {
            return `
                <div onclick="setView('${id}')" class="content-card cursor-pointer border-t-8 ${borderColor} hover:shadow-2xl hover:scale-[1.03] transition-all">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${tag}</span>
                    <h2 class="text-2xl font-black text-slate-800 mt-2">${title}</h2>
                    <p class="text-slate-600 mt-3 text-sm leading-relaxed">${desc}</p>
                    <div class="mt-8 flex items-center text-blue-600 font-bold text-sm">
                        立即開始探索 ${Icons.Next}
                    </div>
                </div>
            `;
        }

        // --- 2. Chapter 4 頁面 ---
        function renderCh4(app) {
            const steps = [
                { title: "定義函式", code: "def greet(name):\n    print('Hello, ' + name)", desc: "使用 def 定義函式，name 是參數 (Parameter)。" },
                { title: "呼叫函式", code: "greet('Alice')", desc: "傳入 'Alice' 作為實參 (Argument) 進行呼叫。" },
                { title: "執行結果", code: "Hello, Alice", desc: "程式執行完畢並在終端機輸出結果。" }
            ];
            const s = steps[state.ch4Step];

            app.innerHTML = `
                <div class="main-container fade-in">
                    <button onclick="setView('menu')" class="mb-6 flex items-center font-bold text-slate-500 hover:text-blue-600 transition-colors">
                        ${Icons.Back} 返回選單
                    </button>
                    
                    <div class="content-card border-t-8 border-blue-500">
                        <h2 class="text-3xl font-black text-slate-800 mb-2">Chapter 4-1: 函式模組化</h2>
                        <p class="text-blue-600 font-bold mb-6 italic">當前步驟：${s.title}</p>

                        <div class="code-block">${s.code.replace(/\n/g, '<br>')}</div>

                        <div class="bg-blue-50 p-6 rounded-xl border border-blue-100 my-6">
                            <p class="text-blue-900 leading-relaxed"><strong>說明：</strong>${s.desc}</p>
                        </div>

                        <div class="flex justify-between items-center mt-12">
                            <button onclick="state.ch4Step=Math.max(0,state.ch4Step-1); render();" class="btn btn-gray">上一步</button>
                            <span class="text-slate-400 font-mono font-bold tracking-widest">${state.ch4Step + 1} / ${steps.length}</span>
                            <button onclick="state.ch4Step=Math.min(${steps.length - 1},state.ch4Step+1); render();" class="btn btn-blue">下一步</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 3. 修復後的 Chapter 6 樹狀圖展示 ---
        function renderCh6(app) {
            // 完整階層數據，包含 6-1 根節點到 6-6 BST 完成態
            const treeData = [
                { act: "6-1 起始：建立根節點 50", nodes: [{v:50, x:400, y:50, id:0}] },
                { act: "6-2 插入 30：比 50 小，放置於左子樹", nodes: [
                    {v:50, x:400, y:50, id:0}, 
                    {v:30, x:220, y:140, p:0, id:1}
                ]},
                { act: "6-3 插入 70：比 50 大，放置於右子樹", nodes: [
                    {v:50, x:400, y:50, id:0}, 
                    {v:30, x:220, y:140, p:0, id:1}, 
                    {v:70, x:580, y:140, p:0, id:2}
                ]},
                { act: "6-4 插入 20：比 30 小，延伸至第三層左側", nodes: [
                    {v:50, x:400, y:50, id:0}, 
                    {v:30, x:220, y:140, p:0, id:1}, {v:70, x:580, y:140, p:0, id:2},
                    {v:20, x:130, y:230, p:1, id:3}
                ]},
                { act: "6-5 插入 40, 60, 80：樹狀結構趨於完整", nodes: [
                    {v:50, x:400, y:50, id:0}, 
                    {v:30, x:220, y:140, p:0, id:1}, {v:70, x:580, y:140, p:0, id:2},
                    {v:20, x:130, y:230, p:1, id:3}, {v:40, x:310, y:230, p:1, id:4},
                    {v:60, x:490, y:230, p:2, id:5}, {v:80, x:670, y:230, p:2, id:6}
                ]},
                { act: "6-6 最終態：完整的二元搜尋樹結構", nodes: [
                    {v:50, x:400, y:50, id:0}, 
                    {v:30, x:220, y:140, p:0, id:1}, {v:70, x:580, y:140, p:0, id:2},
                    {v:20, x:130, y:230, p:1, id:3}, {v:40, x:310, y:230, p:1, id:4},
                    {v:60, x:490, y:230, p:2, id:5}, {v:80, x:670, y:230, p:2, id:6}
                ]}
            ];
            
            if (state.ch6Step >= treeData.length) state.ch6Step = treeData.length - 1;
            const data = treeData[state.ch6Step];

            app.innerHTML = `
                <div class="main-container fade-in">
                    <button onclick="setView('menu')" class="mb-6 flex items-center font-bold text-slate-500 hover:text-emerald-600 transition-colors">
                        ${Icons.Back} 返回選單
                    </button>

                    <div class="content-card border-t-8 border-emerald-500">
                        <h2 class="text-3xl font-black text-slate-800 mb-6">6-1 ~ 6-6 樹與二元搜尋樹</h2>
                        
                        <div class="bg-emerald-50 text-emerald-800 p-5 rounded-2xl mb-8 text-center font-bold border border-emerald-100 shadow-sm">
                            ${data.act}
                        </div>

                        <div class="bg-slate-50 rounded-2xl p-6 border border-slate-200 shadow-inner relative overflow-hidden" style="min-height: 400px;">
                            <!-- 擴大畫布 viewBox 高度到 320，確保第三層與文字標籤完整呈現 -->
                            <svg viewBox="0 0 800 320" class="w-full">
                                <!-- 先繪製線條，確保線在節點下方 -->
                                ${data.nodes.filter(n => n.p !== undefined).map(n => {
                                    const p = data.nodes.find(node => node.id === n.p);
                                    return `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />`;
                                }).join('')}
                                
                                <!-- 繪製節點與文字 -->
                                ${data.nodes.map(n => `
                                    <g class="transition-all duration-500">
                                        <circle cx="${n.x}" cy="${n.y}" r="26" fill="white" stroke="#10b981" class="node-circle" />
                                        <text x="${n.x}" y="${n.y}" text-anchor="middle" dy="7" font-weight="900" fill="#064e3b" class="text-lg font-mono node-text">${n.v}</text>
                                    </g>
                                `).join('')}
                            </svg>
                        </div>

                        <div class="flex justify-between items-center mt-12">
                            <button onclick="state.ch6Step=Math.max(0,state.ch6Step-1); render();" class="btn btn-gray">上一步</button>
                            <div class="flex flex-col items-center">
                                <span class="text-slate-400 font-mono font-bold tracking-widest">${state.ch6Step + 1} / ${treeData.length}</span>
                                <div class="flex gap-1 mt-2">
                                    ${treeData.map((_, i) => `<div class="w-2 h-2 rounded-full ${i === state.ch6Step ? 'bg-emerald-500' : 'bg-slate-200'}"></div>`).join('')}
                                </div>
                            </div>
                            <button onclick="state.ch6Step=Math.min(${treeData.length - 1},state.ch6Step+1); render();" class="btn btn-blue bg-emerald-600 hover:bg-emerald-700">下一步</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 全域渲染邏輯 ---
        function render() {
            const app = document.getElementById('app');
            switch(state.view) {
                case 'menu': renderMenu(app); break;
                case 'ch4_1': 
                case 'ch4_4': renderCh4(app); break;
                case 'ch6_6': renderCh6(app); break;
                default: 
                    app.innerHTML = `
                        <div class="main-container text-center py-32 fade-in">
                            <h2 class="text-3xl font-black text-slate-300 mb-6">單元建設中...</h2>
                            <button onclick="setView('menu')" class="btn btn-blue">返回主選單</button>
                        </div>`;
            }
        }

        window.onload = render;
    </script>
</body>
</html>
